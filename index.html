<html lang="zh-Hant">

  <link rel="manifest" href="./manifest.webmanifest">

  <title>Personal Secretary</title>
  <style>
    :root{--bg:#fff8f5;--panel:#fff;--ink:#20231f;--muted:#777c73;--line:#e5e7df;--accent:#d87d75;--accent2:#fff0eb;--warn:#9b5b37;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #edb5aa;outline-offset:2px}
    .app{max-width:780px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
    header{padding:22px 2px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.brand{font-size:27px;font-weight:750;letter-spacing:-.04em;margin:2px 0 0}.date{color:var(--ink);font-size:22px;font-weight:750;letter-spacing:-.035em}
    .top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:7px 10px;font-size:13px}.btn.danger{color:#a13c2f}
    .hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;margin-bottom:16px}.hero .eyebrow{color:#ffe3dd}.hero h2{font-size:23px;line-height:1.2;margin:8px 0}.hero p{margin:0;color:#fff0eb;font-size:14px}.hero-stats{display:flex;gap:22px;margin-top:18px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#ffe3dd}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:106px;color:var(--ink)}.tile .emoji{font-size:21px}.tile strong{display:block;margin:7px 0 3px}.tile small{color:var(--muted)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}.section-head h2{font-size:20px;margin:0}.subtle{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}
    .item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}.item-main{min-width:0;flex:1}.item-title{font-weight:600;overflow-wrap:anywhere}.item-title.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:4px}.textbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;font-size:13px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:90px}form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}
    .nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,250,247,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:min(780px,100%);display:grid;grid-template-columns:repeat(1,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:grid;justify-items:center;gap:4px}.nav button span{font-size:19px}.nav button.active{color:var(--accent);background:var(--accent2);font-weight:700}
    .progress{height:7px;background:#f8e5e0;border-radius:9px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:9px}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:999px;font-size:11px}.notice{border-radius:12px;background:#fff0eb;color:#945b58;padding:11px;font-size:13px;margin-bottom:12px}
    .barrow{display:grid;grid-template-columns:64px 1fr 76px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bartrack{height:10px;background:#f8e5e0;border-radius:10px;overflow:hidden}.bartrack span{display:block;height:100%;background:var(--accent);border-radius:10px}.barvalue{text-align:right;color:var(--muted)}
    .checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:9px}.calendar-weekdays div{text-align:center;color:var(--muted);font-size:12px}.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-height:48px;padding:6px 2px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink)}.calendar-day i{height:4px;max-width:90%;border-radius:5px;display:block}.calendar-day small{font-size:6px;line-height:4px;color:var(--accent)}.calendar-day.selected{background:var(--accent2);border-color:var(--accent)}.calendar-day.today span{font-weight:800;text-decoration:underline}.footnote{font-size:12px;color:var(--muted);margin-top:12px}
    details.clean{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:12px}details.clean summary{cursor:pointer;font-weight:650;list-style-position:inside}details.clean .card{margin:12px 0 0}.mini-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chart-legend{display:grid;gap:8px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}.calendar-day{min-width:0}.calendar-day:disabled{opacity:.45}.date-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(min-width:650px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:25px}.brand{font-size:30px}}
    @media(max-width:390px){.app{padding-left:12px;padding-right:12px}.top-actions .btn{padding:8px}.formgrid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}.hero-stats{gap:15px}}
    .gear-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:10px}.gear-grid .item{min-width:0;padding:8px 0}.gear-grid .item-actions{flex-shrink:0}.gear-grid .textbtn{padding:3px;font-size:12px}.journal-group{margin-top:8px} .journal-group details.clean{margin-top:8px} .journal-group .item{align-items:flex-start}
    #modal .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#modal .field{min-width:0}#modal .field input,#modal .field select{padding:9px 7px;font-size:14px}#modal .field.full{grid-column:1/-1}details.clean summary .meta{font-weight:400}.choice-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 15px}.choice-row .chosen{background:var(--accent);color:#fff;border-color:var(--accent)}

    .subscription-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:10px 3px 20px;scrollbar-width:thin}
    .subscription-bubble{flex:0 0 166px;min-height:184px;border:1px solid var(--line);border-radius:27px;background:var(--panel);box-shadow:0 5px 18px #7d4b4b1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:15px 12px;text-align:center;scroll-snap-align:start;color:var(--ink);transition:transform .15s}
    .subscription-bubble:active{transform:scale(.97)}.subscription-bubble strong{max-width:100%;overflow-wrap:anywhere;font-size:15px}.subscription-bubble small{color:var(--muted);font-size:11px}.subscription-price{font-size:14px;font-weight:700;color:var(--accent)}
    .subscription-symbol{width:62px;height:62px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:27px;font-weight:750}
    .subscription-detail-head{display:flex;flex-direction:column;align-items:center;gap:11px;padding:24px}.subscription-detail-head h2{margin:0;font-size:24px;text-align:center;overflow-wrap:anywhere}.subscription-detail-price{font-size:23px;font-weight:750;color:var(--accent)}
    .subscription-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 12px;padding:10px 0}.subscription-info span{color:var(--muted);font-size:13px}.subscription-info strong{text-align:right;overflow-wrap:anywhere;font-size:13px}.subscription-note{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.subscription-note p{white-space:pre-wrap;overflow-wrap:anywhere}
    :root[data-theme="dark"]{--bg:#191716;--panel:#282320;--ink:#f8f0e9;--muted:#c2b0a2;--line:#4b3a30;--accent:#f3ada4;--accent2:#503536;--warn:#e2a67f;color-scheme:dark}
    :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#342b25;color:var(--ink)}
    :root[data-theme="dark"] .nav{background:rgba(28,23,20,.96)}
    :root[data-theme="dark"] .hero{background:#7d4b4b;color:#fff}
    :root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .choice-row .chosen{color:#24180f}
    :root[data-theme="dark"] .progress,:root[data-theme="dark"] .bartrack{background:#503638}
    :root[data-theme="dark"] .notice{background:#57393c;color:#ffcbc5}
    .subscription-filter{margin-bottom:12px}.subscription-list details.clean{margin-bottom:9px}.subscription-list summary{display:flex;justify-content:space-between;align-items:center;gap:8px}.subscription-list summary::marker{color:var(--accent)}
    .billing-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;padding:12px;border-radius:13px;background:var(--accent2);font-weight:650}.billing-flow .arrow{font-size:23px;color:var(--accent)}
    .journal-entry{padding:12px 0;border-bottom:1px solid var(--line)}.journal-entry:last-child{border:0}.journal-entry p{white-space:pre-wrap;overflow-wrap:anywhere}
    .journal-entry summary{cursor:pointer;padding:7px 0}.journal-entry[open] summary{color:var(--accent)}
    form[data-form="add-pack"]{flex-wrap:wrap}form[data-form="add-pack"] input{flex:1;min-width:110px}
    :root{--line:#efdedb;--muted:#867571} :root[data-theme="dark"]{--line:#584043;--muted:#cfb4b4}

    .gear-category-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:14px}
    .gear-group{min-width:0}.gear-group-heading{min-height:48px;display:flex;justify-content:space-between;align-items:flex-start;gap:5px;border-bottom:1px solid var(--line);padding:0 0 10px}.gear-group-heading strong{font-size:16px;overflow-wrap:anywhere}.gear-group-heading .textbtn{font-size:11px;flex-shrink:0}
    .gear-group-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;padding-top:9px}.gear-check-row{display:flex;align-items:center;gap:6px;min-height:39px;min-width:0}.gear-check-row input{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent)}.gear-check-row span{flex:1;min-width:0;overflow-wrap:anywhere}.gear-check-row span.done{text-decoration:line-through;color:var(--muted)}.gear-check-row .textbtn{opacity:.7;font-size:17px}
    .gear-text-only-action{font-size:12px!important;padding:4px 5px!important;white-space:nowrap;color:var(--muted)}
    .gear-add-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
    @media(max-width:640px){.gear-category-layout{grid-template-columns:minmax(0,1fr)}.gear-add-form{grid-template-columns:1fr 1fr}.gear-add-form button{grid-column:1/-1}}
    @media(max-width:390px){.gear-category-layout{grid-template-columns:minmax(0,1fr);gap:12px}.gear-group-heading strong{font-size:14px}.gear-check-row{gap:4px}.gear-check-row span{font-size:13px}}
    .food-cost-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.food-cost-item{display:flex;justify-content:space-between;gap:8px;padding:9px;border-radius:10px;background:var(--accent2);font-size:12px}.food-cost-item strong{white-space:nowrap}.food-day-group{padding:14px 0;border-bottom:1px solid var(--line)}.food-day-group:last-child{border-bottom:0}
    .food-day-bubbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.food-day-bubble{border:1px solid var(--line);border-radius:24px;padding:14px;background:var(--panel);min-width:0;box-shadow:0 4px 12px #7d4b4b0d}.food-day-bubble .food-meal-group{margin-top:10px}.food-day-bubble>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:7px}.food-day-bubble>summary::-webkit-details-marker{display:none}.food-day-summary strong{font-size:16px}.food-day-hint{font-size:12px;color:var(--accent);margin-top:4px}.food-day-bubble[open] .food-day-hint{display:none}.food-day-detail{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}.food-day-bubble details.clean{padding:9px;margin-bottom:7px}.food-note-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.food-note-tags button{font-size:12px}.hero-subscriptions{margin-top:16px;padding-top:13px;border-top:1px solid #ffffff66}.hero-subscriptions .subscription-heading{font-size:14px;font-weight:700;margin-bottom:7px}.hero-subscriptions .item{border-color:#ffffff55}.hero-subscriptions .meta{color:#fff0eb}.hero-subscriptions .btn{background:#ffffffeb;color:#56332e}@media(max-width:390px){.food-day-bubbles{grid-template-columns:1fr}}
    .page-back{margin:2px 0 12px} .food-day-link{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}.food-day-link strong{font-size:16px}.food-day-link:active{transform:scale(.98)}
    .food-tag-manager{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.food-tag-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 9px;background:var(--accent2)}.food-tag-chip button{border:0;background:transparent;color:var(--ink);padding:4px 6px}.food-tag-chip .food-tag-remove{color:var(--warn);font-weight:700}.food-tag-add{display:flex;gap:7px;margin-top:10px}.food-tag-add input{flex:1;min-width:0}.food-pie-layout{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:15px}.food-pie{width:160px;height:160px;border-radius:50%;flex-shrink:0}.food-meal-group{margin:12px 0 8px;padding:10px 0 0;border-top:1px dashed var(--line)}.food-note-preview{font-weight:400;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}
    /* V32: 汽車紀錄表單固定雙欄，類型獨占一行；日期欄位使用原生控制項 */
    #modal .car-form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 12px}
    #modal .car-form-grid .field{min-width:0;gap:7px}
    #modal .car-form-grid input,#modal .car-form-grid select{width:100%;min-width:0;max-width:100%;padding:11px 9px;font-size:16px}
    #modal .car-form-grid .field.full{grid-column:1/-1}
    .car-jump{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
    .car-jump .field{min-width:0}.car-jump select,.car-jump input{padding:9px 5px;font-size:14px}
    .car-history-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    @media(max-width:390px){.car-jump{grid-template-columns:repeat(2,minmax(0,1fr))}}
    /* V35：汽車表單在 iPhone 保持雙欄，限制原生日期控制項內部寬度，避免侵入相鄰里程欄位 */
    @media(max-width:600px){
      #modal .car-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;min-width:0}
      #modal .car-form-grid>.field{grid-column:auto;min-width:0;max-width:100%;overflow:hidden}
      #modal .car-form-grid>.field.full{grid-column:1/-1;overflow:visible}
      #modal .car-form-grid>.field>label{min-width:0;overflow-wrap:anywhere;font-size:11px;line-height:1.4}
      #modal .car-form-grid>.field>input{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;height:43px;padding:9px 5px;font-size:14px}
      #modal .car-form-grid>.field>input[type="date"]{font-size:12px;letter-spacing:-.35px;padding:9px 2px;overflow:hidden;-webkit-appearance:none;appearance:none}
      #modal .car-form-grid input[type="date"]::-webkit-date-and-time-value{min-width:0;width:100%;text-align:left}
      #modal .car-form-grid input[type="date"]::-webkit-datetime-edit{min-width:0;padding:0;white-space:nowrap;font-size:12px}
      #modal .car-form-grid input[type="date"]::-webkit-calendar-picker-indicator{flex-shrink:0;width:12px;margin:0;padding:0}
    }
    /* V33：所有表單提醒勾選框與文字緊鄰排列，不受通用 input 寬度影響 */
    #modal label.checkline{display:inline-flex;align-items:center;justify-content:flex-start;gap:7px;width:fit-content;max-width:100%;cursor:pointer;flex-wrap:nowrap}
    #modal label.checkline input[type="checkbox"]{display:inline-block;width:18px!important;min-width:18px!important;max-width:18px!important;height:18px;flex:0 0 18px;margin:0;padding:0;vertical-align:middle}
    #modal label.checkline .checkline-text{display:inline;min-width:0;white-space:normal;overflow-wrap:anywhere}
    .food-detail-heading{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}.food-detail-heading h3{margin:0}.food-detail-heading .subtle{text-align:right}
    .settings-services{display:grid;gap:0}.settings-service{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}.settings-service:last-child{border-bottom:0}.settings-service input[type="checkbox"]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--accent)}

    /* V39：本日餐飲紀錄依序列出餐點名稱、飲食標籤、價錢，不顯示用餐時間 */
    .food-record-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;list-style:none}
    .food-record-summary::-webkit-details-marker{display:none}
    .food-record-name{grid-column:1;grid-row:1;overflow-wrap:anywhere;font-size:15px}
    .food-record-tags{grid-column:1;grid-row:2;color:var(--muted);font-size:12px;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere}
    .food-record-price{grid-column:2;grid-row:1/3;justify-self:end;align-self:center;font-weight:700;white-space:nowrap;color:var(--accent)}

    /* V41：首頁日期優先保留單行，操作按鈕緊湊排列並維持觸控空間 */
    header{gap:6px;min-width:0}
    header>div:first-child{flex:1 1 auto;min-width:0}
    header .date{white-space:nowrap;font-size:clamp(13px,4.15vw,22px);letter-spacing:-.055em;font-variant-numeric:tabular-nums}
    header .top-actions{flex:0 0 auto;align-items:center;gap:5px;white-space:nowrap}
    header .top-actions .btn.small{padding:7px 7px;font-size:12px;white-space:nowrap}
    @media(max-width:390px){header{gap:4px}header .top-actions{gap:4px}header .top-actions .btn.small{padding:7px 5px;font-size:11px}}

    /* V46: directly tap an icon to open its compact icon picker */
    .editable-icon{display:inline-flex;align-items:center;justify-content:center;min-width:25px;min-height:25px;border-radius:7px;cursor:pointer;touch-action:manipulation;vertical-align:middle}
    .editable-icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .tile .editable-icon{min-width:34px;min-height:34px}
    .icon-palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;max-height:270px;overflow-y:auto}
    /* V45: numeric hints and customizable colorful interface icons */
    input[type="number"]::placeholder{color:var(--muted);opacity:.8}
    .icon-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .icon-setting{border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
    .icon-setting label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .icon-setting input{font-size:15px;padding:8px;margin-top:7px}
    .icon-palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
    .icon-choice{border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:23px;min-height:39px;padding:3px;line-height:1.3}
    .icon-choice.chosen{border:2px solid var(--accent);background:var(--accent2)}
    .tile .emoji,.nav button span{display:inline-block;line-height:1.2}
    @media(max-width:370px){.icon-settings-grid{grid-template-columns:1fr}}

    /* V50: settings list has its own order; home quick entries follow settings, not More. */
     .settings-service{cursor:default;min-width:0}
     .settings-service-name{flex:1;min-width:0}
     .settings-services .settings-service .drag-handle{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--accent2);color:var(--ink);font-size:22px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
     .settings-services .settings-service.drag-origin{opacity:.45}
     .settings-services .settings-service.drag-target{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent2)}
     .settings-services .settings-service input[type=checkbox]{margin:0}
     /* V49: sortable service tiles; drag only from handle while unlocked */
    .sortable-grid .tile{position:relative;min-width:0}
    .sortable-grid .tile .drag-handle{position:absolute;top:7px;right:7px;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--accent2);color:var(--ink);font-size:21px;touch-action:none;cursor:grab;z-index:2;user-select:none;-webkit-user-select:none}
    .sortable-grid .tile .drag-handle:active{cursor:grabbing}
    .sortable-grid .tile.drag-origin{opacity:.5}
    .sortable-grid .tile.drag-target{outline:3px dashed var(--accent);outline-offset:-4px}
    .sort-status{font-size:12px;color:var(--muted);margin:6px 0 10px}
    .sort-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .sort-controls .btn{white-space:nowrap}

    /* V52: companion-app sorting presentation: a full-width toolbar and full-card drag. */
    .gf-order-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
    .gf-order-toolbar .subtle{flex:1;min-width:140px}
    .gf-order-toolbar .btn{white-space:nowrap;flex-shrink:0}
    #view .gf-order-mode .tile[data-tab]{touch-action:none;cursor:grab;outline:2px dashed var(--accent);outline-offset:-3px;user-select:none;-webkit-user-select:none;min-width:0;padding:14px}
    #view .gf-order-mode .tile[data-tab]::after{content:'☰ 拖曳排序';display:block;font-size:11px;color:var(--accent);margin-top:6px}
    #view .gf-order-mode .tile.drag-origin{opacity:.5;cursor:grabbing}
    #view .gf-order-mode .tile.drag-target{box-shadow:0 0 0 3px var(--accent);background:var(--accent2)}
    #view .gf-order-mode .editable-icon{pointer-events:none}
    #view .gf-order-mode .settings-service{touch-action:none;cursor:grab;outline:2px dashed var(--accent);outline-offset:-3px;user-select:none;-webkit-user-select:none;border-radius:10px;margin:5px 0;padding:12px 10px;flex-wrap:wrap}
    #view .gf-order-mode .settings-service::after{content:'☰ 拖曳排序';font-size:11px;color:var(--accent);flex-basis:100%}
    #view .gf-order-mode .settings-service.drag-origin{opacity:.5}
    #view .gf-order-mode .settings-service.drag-target{box-shadow:0 0 0 3px var(--accent);background:var(--accent2)}
    #view .gf-order-mode .settings-service input[type=checkbox]{touch-action:manipulation}
    #view .sortable-grid:not(.gf-order-mode) .tile{padding:14px}

    /* V56: project-based Notion-inspired itinerary board and detail view */
    .plan-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .plan-board{display:flex;gap:12px;overflow-x:auto;padding:8px 1px 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
    .plan-column{flex:0 0 min(260px,83vw);background:var(--accent2);border-radius:15px;padding:10px;scroll-snap-align:start;min-width:0}
    .plan-column-head{font-weight:750;font-size:13px;padding:4px 3px 10px;display:flex;justify-content:space-between;gap:8px}
    .plan-item{display:block;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:9px;color:var(--ink);padding:0;box-shadow:0 2px 6px #00000009}
    .plan-item img{display:block;width:100%;height:112px;object-fit:cover}
    .plan-item-body{display:grid;gap:5px;padding:10px;font-size:12px}.plan-item-body strong{font-size:14px}.plan-chip{display:inline-block;width:max-content;max-width:100%;padding:2px 7px;border-radius:7px;background:#e7eff9;color:#315879;font-size:11px}
    .plan-detail{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel);margin-top:12px}
    .plan-detail-photo{width:100%;max-height:250px;object-fit:cover;border-radius:12px;margin:9px 0}
    .plan-props{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;font-size:13px;margin:14px 0}.plan-props dt{color:var(--muted)}.plan-props dd{margin:0;overflow-wrap:anywhere}
    .plan-description{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:12px}
    @media(min-width:700px){.plan-board{gap:14px}.plan-column{flex-basis:280px}}
    .plan-project-list{display:grid;gap:8px;margin:10px 0}.plan-project-choice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left;width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px}.plan-project-choice strong{flex:1;min-width:100px}.plan-project-choice span{font-size:12px;color:var(--muted)}.plan-project-choice small{background:var(--accent2);padding:4px 7px;border-radius:10px}.plan-project-choice.active{border:2px solid var(--accent)}.plan-item-body{min-height:56px}.plan-props a{color:var(--accent);overflow-wrap:anywhere}
    .google-cloud-panel{display:grid;gap:10px}.google-cloud-panel .row{flex-wrap:wrap}.google-cloud-panel input{font-size:13px}.cloud-status{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  
    .hero .hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .hero button.stat{min-width:0;text-align:left;border:1px solid #ffffff80;border-radius:14px;padding:12px 8px;background:#ffffffd9;color:#493b2d}
    .hero button.stat span{color:inherit;display:block}.hero button.stat small{display:block;margin-top:7px;font-size:11px;opacity:.75}
    .hero button.stat:hover,.hero button.stat[aria-expanded="true"]{background:#fff4de;border-color:#ad8e58}
    .hero .home-detail{margin:14px 0 0;color:var(--ink);background:var(--panel)}
    .hero .home-detail .meta{color:var(--muted)}
  
    .hero{padding:0;overflow:hidden;background:#f7efdf;color:#493b2d;border:1px solid #e8dcc7}
    .hero-cover{padding:20px 16px 0;background:#f7efdf}

    .hero .hero-subscriptions{margin:0;padding:16px 20px;background:#fffaf0eb;border-top:1px solid #ddceb3}
    .hero .hero-subscriptions .meta{color:#6c5b43}
    .hero .hero-subscriptions .item{border-color:#ddceb3}
    .hero .home-detail{margin:0;border-radius:0;border-left:0;border-right:0}
    :root[data-theme="dark"] .hero{background:#332c23;color:#493b2d;border-color:#66543c}
    :root[data-theme="dark"] .hero-subscriptions{background:#332c23;color:#f1e6d6;border-color:#66543c}
    :root[data-theme="dark"] .hero-subscriptions .meta{color:#d8c8b0}

<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(() => {
  'use strict';
  const DB_NAME='daily-life-db', DB_VERSION=1, STORE='records';
  const $ = (s,root=document)=>root.querySelector(s);
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const monthKey = (date) => (date||today()).slice(0,7);
  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const localDateTime = () => {const d=new Date();return `${dateKey(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const safeDate = s => {const d=new Date((s||today())+'T12:00:00');return Number.isNaN(d.getTime())?new Date():d;};
  const dateTimeLabel = s => s ? new Date(s).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) : '未設定開始時間';
  const getHabitLog = (habitId,date) => data.habitLogs.find(l=>l.habitId===habitId&&l.date===date);
  const habitPercent = (habitId,date) => {const l=getHabitLog(habitId,date);return Math.max(0,Math.min(100,Number(l?.progress ?? (l?100:0))));};
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const escapeHTML = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0);
  let homeDetail='', db, currentTab='home', selectedHabitDate=today(), habitCalendarMonth=today().slice(0,7), habitCalendarExpanded=false, journalDate=today(), journalCalendarMonth=monthKey(), reportMonth=monthKey(), tripFilter='all', carFilter='all', reportDetail='', journalCalendarExpanded=false, reportCalendarExpanded=false, reportDate=today(), journalClearAfterSave=false, reportOverviewOpen=false, reportRowsOpen=true, journalYearChoice='', journalMonthChoice='', journalDayChoice='', selectedSubscriptionId='', expandedTripIds=new Set(), subscriptionFilter='active', foodSelectedDate=today(), foodCalendarExpanded=false, foodDetailDate='', carSelectedDate=today(), carCalendarExpanded=false, carCalendarMonth=monthKey(), carHistoryYear='', carHistoryMonth='', previousTabs=[], editingJournalId='', data={todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[],foods:[],tripPlans:[],tripProjects:[],foodNoteTags:["蔬菜","水果","油炸","水煮","肉類","乳製品"]};
  const themePref=()=>{try{return localStorage.getItem('ps-theme')||'light';}catch(e){return 'light';}};
  function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#191716':'#fff8f5';$('#themeToggle').innerHTML=editableIcon('theme')+' '+(theme==='dark'?'淺色':'深色');try{localStorage.setItem('ps-theme',theme);}catch(e){}}
  const serviceOptions=[['tasks','待辦事項'],['habits','習慣追蹤'],['subscriptions','訂閱管理'],['journal','生活紀錄'],['trips','行前準備'],['car','汽車管理'],['reports','月報表'],['foods','飲食紀錄']];
  const serviceKey='ps-service-visibility';
  let serviceVisibility={};
  try{const saved=JSON.parse(localStorage.getItem(serviceKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))serviceVisibility=saved;}catch(e){}
  const serviceEnabled=id=>serviceVisibility[id]!==false;
  const serviceForPage=id=>id==='overviewDetail'?(homeDetail==='habits'?'habits':'tasks'):({subscriptionDetail:'subscriptions',foodDayDetail:'foods'})[id]||id;
  const serviceTiles=html=>html.replace(/<button\b[^>]*data-tab="(tasks|habits|subscriptions|journal|trips|car|reports|foods)"[^>]*>[\s\S]*?<\/button>/g,(markup,id)=>serviceEnabled(id)?markup:'');
  function settings(){return `<div class="section-head"><h2>設定</h2></div><div class="card"><div class="section-head"><h3>記錄選擇</h3></div>${orderControls()}<p class="subtle">勾選代表啟用，取消勾選則隱藏對應功能；此處已啟用項目的排序前三名，將成為首頁快速入口的三個主要功能。「更多」固定最後。既有紀錄不會刪除。</p><div class="settings-services ${!orderLocked?'gf-order-mode':''}" data-sort-grid="settings">${settingsOrder.map(id=>{const label=serviceOptions.find(o=>o[0]===id)?.[1]||id;return `<div class="settings-service" data-sort-id="${id}"><span class="settings-service-name">${escapeHTML(label)}</span><input type="checkbox" data-service-toggle="${id}" ${serviceEnabled(id)?'checked':''} aria-label="顯示${escapeHTML(label)}"></div>`;}).join('')}</div></div>${firebaseCloudPanel()}`;}
  // V49: persistent layout order and a separate lock against accidental rearrangement.
  const orderKey='ps-service-order',orderLockKey='ps-service-order-locked';
  const defaultServiceOrder=['tasks','habits','subscriptions','journal','trips','car','reports','foods'];
  const settingsOrderKey='ps-settings-service-order';
  let serviceOrder=[...defaultServiceOrder],orderLocked=true;
  try{const saved=JSON.parse(localStorage.getItem(orderKey)||'null');if(Array.isArray(saved))serviceOrder=[...new Set(saved.filter(id=>defaultServiceOrder.includes(id))),...defaultServiceOrder.filter(id=>!saved.includes(id))];}catch(e){}
  let settingsOrder=[...serviceOrder];
  try{const saved=JSON.parse(localStorage.getItem(settingsOrderKey)||'null');if(Array.isArray(saved))settingsOrder=[...new Set(saved.filter(id=>defaultServiceOrder.includes(id))),...defaultServiceOrder.filter(id=>!saved.includes(id))];}catch(e){}
  try{orderLocked=localStorage.getItem(orderLockKey)!=='false';}catch(e){}
  function persistOrder(){try{localStorage.setItem(orderKey,JSON.stringify(serviceOrder));localStorage.setItem(settingsOrderKey,JSON.stringify(settingsOrder));}catch(e){}}
  function setOrderLock(locked){orderLocked=!!locked;try{localStorage.setItem(orderLockKey,String(orderLocked));}catch(e){}render();}
  function orderControls(){return `<div class="sort-controls"><button class="btn small" type="button" data-action="toggle-order-lock" aria-pressed="${orderLocked}">${orderLocked?'🔒 排列已鎖定':'🔓 排列編輯中'}</button></div>${!orderLocked?'<div class="sort-status">按住功能卡片右上角的 ☰，拖曳至其他功能上即可調整順序。完成後請重新鎖定。</div>':''}`;}
  function sortableGrid(ids,options,extra=''){const byId=new Map(options.map(o=>[o[0],o]));return `<div class="grid sortable-grid" data-sort-grid="services">${ids.filter(id=>serviceEnabled(id)&&byId.has(id)).map(id=>{const [,emoji,label,desc]=byId.get(id);return `<button class="tile" type="button" data-tab="${id}"><span class="emoji">${emoji}</span><strong>${label}</strong><small>${desc}</small></button>`;}).join('')}${extra}</div>`;}
  function moveService(from,to,scope='services'){if(orderLocked||from===to||!defaultServiceOrder.includes(from)||!defaultServiceOrder.includes(to))return;const order=scope==='settings'?settingsOrder:serviceOrder;const next=order.filter(id=>id!==from),at=next.indexOf(to);if(at<0)return;next.splice(at,0,from);if(scope==='settings')settingsOrder=next;else serviceOrder=next;persistOrder();render();}
  // V52: same full-card drag interaction as the companion app; no overlay handle.
  let dragSession=null, suppressSortClick=false;
  const sortItem=el=>el?.closest('#view .gf-order-mode .tile[data-tab],#view .gf-order-mode .settings-service[data-sort-id]');
  const clearSortHighlights=()=>document.querySelectorAll('.drag-origin,.drag-target').forEach(el=>el.classList.remove('drag-origin','drag-target'));
  document.addEventListener('pointerdown',e=>{
    if(orderLocked||e.button!==0||e.target.closest('input,select,textarea,.editable-icon'))return;
    const tile=sortItem(e.target);if(!tile)return;
    const id=tile.dataset.tab||tile.dataset.sortId;
    if(!defaultServiceOrder.includes(id))return;
    e.preventDefault();
    dragSession={id,pointerId:e.pointerId,origin:tile,scope:tile.closest('[data-sort-grid]')?.dataset.sortGrid||'services',x:e.clientX,y:e.clientY,moved:false};
    tile.classList.add('drag-origin');try{tile.setPointerCapture(e.pointerId);}catch(err){}
  },true);
  document.addEventListener('pointermove',e=>{
    if(!dragSession||e.pointerId!==dragSession.pointerId)return;
    if(Math.hypot(e.clientX-dragSession.x,e.clientY-dragSession.y)>8)dragSession.moved=true;
    document.querySelectorAll('.drag-target').forEach(el=>el.classList.remove('drag-target'));
    const target=sortItem(document.elementFromPoint(e.clientX,e.clientY));
    if(target&&target!==dragSession.origin&&target.closest('[data-sort-grid]')?.dataset.sortGrid===dragSession.scope)target.classList.add('drag-target');
  },true);
  document.addEventListener('pointerup',e=>{
    if(!dragSession||e.pointerId!==dragSession.pointerId)return;
    const drag=dragSession;dragSession=null;
    const target=sortItem(document.elementFromPoint(e.clientX,e.clientY));
    clearSortHighlights();suppressSortClick=true;
    if(drag.moved&&target&&target!==drag.origin&&target.closest('[data-sort-grid]')?.dataset.sortGrid===drag.scope)moveService(drag.id,target.dataset.tab||target.dataset.sortId,drag.scope);
  },true);
  document.addEventListener('pointercancel',()=>{dragSession=null;clearSortHighlights();},true);
  document.addEventListener('click',e=>{
    if(suppressSortClick){suppressSortClick=false;if(e.target.closest('.tile,.settings-service')){e.preventDefault();e.stopImmediatePropagation();return;}}
    if(!orderLocked&&sortItem(e.target)&&!e.target.closest('input,.editable-icon')){e.preventDefault();e.stopImmediatePropagation();}
  },true);
  // V45: user-editable colorful emoji icons, stored separately from app records.
  const iconKey='ps-custom-icons';
  const iconDefinitions=[
    ['home','首頁','🏠'],['settings','設定','⚙️'],['theme','深淺色切換','🌓'],
    ['tasks','待辦事項','✅'],['habits','習慣追蹤','🎯'],['subscriptions','訂閱管理','💳'],
    ['journal','生活紀錄','📔'],['trips','行前準備','🏕️'],['car','汽車管理','🚗'],
    ['reports','月報表','📊'],['foods','飲食紀錄','🍱'],['more','更多','🧩'],
    ['add','新增','➕'],['edit','編輯','✏️'],['delete','刪除','🗑️'],
    ['previous','上一頁／週／月','⬅️'],['next','下一頁／週／月','➡️'],
    ['close','關閉','❌']
  ];
  const iconPalette=['🏠','⚙️','🌓','☀️','🌙','✅','📋','🎯','⏰','💳','💰','📔','📝','🏕️','🧳','⛰️','🚗','🔧','📊','📈','🍱','🍎','🍽️','🧩','🌈','⭐','💎','❤️','🐱','🐶','🌸','🌻','☕','🎮','📅','🔔','➕','✏️','🗑️','↩️','⬅️','➡️','❌','🔍','🎨'];
  let customIcons={};
  try{const obj=JSON.parse(localStorage.getItem(iconKey)||'{}');if(obj&&typeof obj==='object'&&!Array.isArray(obj))customIcons=obj;for(const id of Object.keys(customIcons))if(!['tasks','habits','subscriptions','journal','trips','car','reports','foods','more'].includes(id))delete customIcons[id];}catch(e){}
  // V48: only the eight primary services and More allow icon customization.
  const editableServiceIcons=new Set(['tasks','habits','subscriptions','journal','trips','car','reports','foods','more']);
  const iconValue=id=>id==='home'?'🏠':editableServiceIcons.has(id)&&customIcons[id]?customIcons[id]:iconDefinitions.find(x=>x[0]===id)?.[2]||'✨';
  function iconEditor(id){
    if(!editableServiceIcons.has(id))return;const definition=iconDefinitions.find(x=>x[0]===id);if(!definition)return;
    const [key,label]=definition;
    modalForm('更換圖示 · '+label,`<div class="field full"><label>目前圖示</label><div class="icon-palette">${iconPalette.map(emoji=>`<button type="button" class="icon-choice ${iconValue(key)===emoji?'chosen':''}" data-icon-id="${key}" data-icon-value="${emoji}" aria-label="選擇${emoji}">${emoji}</button>`).join('')}</div></div><div class="field full"><label>自訂 Emoji 或符號</label><input name="customIcon" type="text" maxlength="16" value="${escapeHTML(iconValue(key))}" placeholder="輸入喜歡的圖示"></div><div class="field full"><button class="btn small" type="button" data-action="default-icon" data-icon-default="${key}">還原此圖示預設值</button></div>`,async fd=>{const value=String(fd.get('customIcon')||'').trim();if(!value){alert('請選擇或輸入圖示');throw Error('圖示不得空白');}saveIcon(key,value);});
  }
  function editableIcon(id){if(!editableServiceIcons.has(id))return `<span class="locked-icon" aria-label="${escapeHTML(iconDefinitions.find(x=>x[0]===id)?.[1]||id)}">${escapeHTML(iconValue(id))}</span>`;return `<span class="editable-icon" data-edit-icon="${id}" role="button" tabindex="0" aria-label="更換${escapeHTML(iconDefinitions.find(x=>x[0]===id)?.[1]||id)}圖示" title="點選更換圖示">${escapeHTML(iconValue(id))}</span>`;}
  function saveIcon(id,value){if(!editableServiceIcons.has(id))return;const next=String(value||'').trim();if(!next)return;customIcons[id]=next.slice(0,16);try{localStorage.setItem(iconKey,JSON.stringify(customIcons));}catch(e){}render();}
  function applyIcons(root=document){
    root.querySelectorAll('.tile[data-tab] .emoji').forEach(el=>{const id=el.closest('[data-tab]').dataset.tab;el.outerHTML=`<span class="emoji">${editableIcon(id)}</span>`;});
    root.querySelectorAll('#nav [data-tab] span').forEach(el=>{if(el.classList.contains('editable-icon'))return;const id=el.closest('[data-tab]').dataset.tab;el.outerHTML=`<span>${editableIcon(id)}</span>`;});
    root.querySelectorAll('button[data-action],button[data-tab],button[data-close],#themeToggle').forEach(btn=>{
      if(btn.closest('.icon-palette')||btn.dataset.action==='default-icon'||btn.classList.contains('gear-text-only-action'))return;
      let id='';const action=btn.dataset.action||'';
      if(btn.id==='themeToggle')id='theme';
      else if(btn.dataset.tab==='settings')id='settings';
      else if(btn.hasAttribute('data-close'))id='close';
      
      else if(/(^new-|^add-)/.test(action))id='add';
      else if(action.startsWith('edit-'))id='edit';
      else if(action.startsWith('delete-'))id='delete';
      else if(/-(prev|previous)$/.test(action))id='previous';
      else if(/-next$/.test(action))id='next';
      if(!id)return;
      const icon=editableIcon(id);
      if(id==='theme'){btn.innerHTML=icon+' '+(themePref()==='dark'?'淺色':'深色');return;}
      if(id==='settings'){btn.innerHTML=icon+' 設定';return;}
      if(id==='previous'||id==='next'){btn.innerHTML=icon;return;}
      
      if(id==='close'){btn.innerHTML='關閉 '+icon;return;}
      const t=btn.textContent.trim().replace(/^[＋+✎✏🗑️➕]\s*/u,'');
      btn.innerHTML=icon+' '+escapeHTML(t);
    });
  }
  // V54: iPhone / Android numeric keyboard for all numeric fields, including dynamically rendered inputs.
  document.addEventListener('focusin',event=>{const input=event.target;if(input instanceof HTMLInputElement&&input.type==='number')input.setAttribute('inputmode','decimal');},true);
  const tabs=[['home','⌂','首頁']];
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  function readAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('appdata');req.onsuccess=()=>resolve(req.result?.value||null);req.onerror=()=>reject(req.error);});}
  function save(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({key:'appdata',value:data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
  function setDefaults(){data={todos:[],habits:[{id:uid(),name:'運動 20 分鐘',active:true},{id:uid(),name:'閱讀或學習',active:true}],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[],foods:[],tripPlans:[],tripProjects:[],foodNoteTags:["蔬菜","水果","油炸","水煮","肉類","乳製品"]};}
  function navRender(){$('#nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${currentTab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join('');}
  function section(title,content,action=''){return `<section class="card"><div class="section-head"><h3>${title}</h3>${action}</div>${content}</section>`;}
  function empty(msg='還沒有紀錄，新增第一筆吧。'){return `<div class="empty">${msg}</div>`;}
  function todoList(items,compact=false){if(!items.length)return empty('目前沒有待辦事項。');return items.map(t=>{const color=t.color||'#dfe9df';const start=t.startAt?dateTimeLabel(t.startAt):'未設定開始時間';const due=t.due||'未設定到期日';return `<div class="item task-item" style="border-left:5px solid ${escapeHTML(color)};padding-left:10px"><input type="checkbox" data-action="toggle-todo" data-id="${t.id}" ${t.done?'checked':''} aria-label="完成 ${escapeHTML(t.title)}"><div class="item-main"><div class="item-title ${t.done?'done':''}">${escapeHTML(t.title)}</div><div class="meta">開始：${escapeHTML(start)} · 到期：${escapeHTML(due)}${t.due&&t.due<today()&&!t.done?' · 已逾期':''}${t.note?' · '+escapeHTML(t.note):''}</div></div>${compact?'':`<div class="item-actions"><button class="textbtn" data-action="edit-todo" data-id="${t.id}">編輯</button><button class="textbtn" data-action="delete-todo" data-id="${t.id}">刪除</button></div>`}</div>`;}).join('');}
  function weekStart(date){const d=safeDate(date);d.setDate(d.getDate()-(d.getDay()+6)%7);return dateKey(d);}
  function habitDue(h,date){
    if(h.active===false && (!h.archivedAt||date>=h.archivedAt))return false;
    const start=(h.cycleStart||h.startAt||'').slice(0,10);
    if(start&&date<start)return false;
    const cycle=h.cycle||'daily';
    if(cycle==='specified'){const weekdays=Array.isArray(h.specifiedWeekdays)?h.specifiedWeekdays.map(Number):[];if(weekdays.length){const weekday=(safeDate(date).getDay()+6)%7+1;if(!weekdays.includes(weekday))return false;}else return false;}
     if(cycle==='once' && date!==(start||h.createdDate||today()))return false;
    if(cycle==='weekly' && start && date>=dateKey(new Date(safeDate(start).getTime()+7*86400000)))return false;
    if(cycle==='yearly' && start){const d=safeDate(start);d.setFullYear(d.getFullYear()+1);if(date>=dateKey(d))return false;}
    const mode=h.taskDays||'daily';
    if(mode==='specific')return String(h.specificDates||'').split(',').map(x=>x.trim().slice(0,10)).includes(date);
    if(mode==='monthly'||mode==='weekly')return true; // 任意天數是期間配額，非指定前 N 天
    return true;
  }
  function habitTarget(h){return Number(h.target??h.targetMinutes??0)||0;}

  function subMoney(n,c){return new Intl.NumberFormat('zh-TW',{style:'currency',currency:c||'TWD',maximumFractionDigits:2}).format(Number(n)||0);}
   function addBilling(date,frequency){const d=safeDate(date);if(frequency==='day')d.setDate(d.getDate()+1);else if(frequency==='week')d.setDate(d.getDate()+7);else {const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(frequency==='month'?1:frequency==='quarter'?3:12));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}return dateKey(d);}

   // 本期終止日採含起始日計算：例如 10/15 月訂閱至 11/14。

  async function firestoreRequest(user,path,method='GET',values=null){
    if(!navigator.onLine)throw Error('裝置目前顯示離線，請檢查網路');

  async function firebaseBackup(){
    if(firebaseBusy)return;firebaseBusy=true;
    try{
      await firebaseInit();const user=firebaseRequireUser();
      if(!confirm('將目前手機資料備份到雲端，並取代上一份雲端備份？'))return;
      firebaseMessage('正在準備備份…');
      const bytes=new TextEncoder().encode(JSON.stringify(backupPayload()));
      const size=180000,count=Math.ceil(bytes.length/size);
      if(count<1||count>400)throw Error('備份資料過大或為空，請先匯出 JSON 備份');
      const hash=await backupDigest(bytes);
      const batch=Date.now().toString(36)+'-'+crypto.randomUUID();
      const root='users/'+user.uid;
      for(let i=0;i<count;i++){
        firebaseMessage('正在上傳 '+(i+1)+' / '+count+'…（REST）');
        await firestoreRequest(user,root+'/backupChunks/'+batch+'_'+i,'PATCH',{
          payload:bytesToBase64(bytes.subarray(i*size,(i+1)*size)),batch,index:i
        });
      }
      firebaseMessage('正在確認備份索引…');
      await firestoreRequest(user,root+'/backups/current','PATCH',{
        batch,count,hash,byteLength:bytes.length,backupAt:new Date().toISOString(),exportedAt:new Date().toISOString(),version:62
      });
      firebaseMessage('備份完成：'+new Date().toLocaleString('zh-TW'));
      alert('已成功備份到 Firebase 雲端。');
    }catch(e){firebaseMessage('備份失敗：'+e.message);alert('雲端備份失敗：'+e.message);}
    finally{firebaseBusy=false;}
  }
  async function firebaseRestore(){
    if(firebaseBusy)return;firebaseBusy=true;
    try{
      await firebaseInit();const user=firebaseRequireUser();
      firebaseMessage('正在查詢雲端備份…');const root='users/'+user.uid;
      const snap=await firestoreRequest(user,root+'/backups/current');
      if(!snap)throw Error('此 Google 帳號尚未建立雲端備份');
      const m=firestoreDecode(snap.fields);
      if(!m.batch||!Number.isInteger(m.count)||m.count<1||m.count>400)throw Error('雲端備份索引格式不符');
      const backupTime=m.backupAt?new Date(m.backupAt).toLocaleString('zh-TW'):m.exportedAt||'時間未知';
      if(!confirm('找到雲端備份（'+backupTime+'）。還原將取代本機資料與設定，確定繼續？')){firebaseMessage('已取消還原');return;}
      const blocks=[];
      for(let i=0;i<m.count;i++){
        firebaseMessage('正在下載 '+(i+1)+' / '+m.count+'…（REST）');
        const part=await firestoreRequest(user,root+'/backupChunks/'+m.batch+'_'+i);
        if(!part)throw Error('備份缺少第 '+(i+1)+' 段資料');
        blocks.push(base64ToBytes(firestoreDecode(part.fields).payload));
      }
      const length=blocks.reduce((n,b)=>n+b.length,0),bytes=new Uint8Array(length);let offset=0;
      for(const block of blocks){bytes.set(block,offset);offset+=block.length;}
      if(length!==m.byteLength||await backupDigest(bytes)!==m.hash)throw Error('備份資料完整性檢查失敗，未覆蓋本機資料');
      const obj=JSON.parse(new TextDecoder().decode(bytes));await applyBackup(obj);
      firebaseMessage('還原完成：'+new Date().toLocaleString('zh-TW'));
      alert('已成功從雲端還原所有備份資料。');
    }catch(e){firebaseMessage('還原失敗：'+e.message);alert('雲端還原失敗：'+e.message);}
    finally{firebaseBusy=false;}
  }

  document.addEventListener('input',e=>{if(e.target.matches('[data-action="habit-progress"]')){const id=e.target.dataset.id,pct=Number(e.target.value)||0;const label=document.querySelector('.habit-percent-'+CSS.escape(id));if(label)label.textContent=pct+'%';const bar=document.querySelector(`[data-progressbar="${CSS.escape(id)}"]`);if(bar)bar.style.width=pct+'%';const h=data.habits.find(x=>x.id===id);if(h&&habitTarget(h)>0){const meta=e.target.parentElement.querySelector('[data-habitamount]');if(meta)meta.textContent=Math.round(habitTarget(h)*pct/100)+' / '+habitTarget(h)+' '+habitUnit(h);}}});
  document.addEventListener('change',e=>{if(e.target.matches('[data-icon-input]')){saveIcon(e.target.dataset.iconInput,e.target.value);return;}},true);
  document.addEventListener('change',e=>{if(e.target.id==='foodChartMode'){foodChartMode=e.target.value==='tags'?'tags':'cost';render();return;}if(e.target.matches('[data-service-toggle]')){const id=e.target.dataset.serviceToggle;if(!serviceOptions.some(([key])=>key===id))return;serviceVisibility[id]=e.target.checked;try{localStorage.setItem(serviceKey,JSON.stringify(serviceVisibility));}catch(err){alert('無法儲存設定，請檢查瀏覽器儲存空間。');}render();return;}const match=e.target.id.match(/^(habit|journal|report|food)Jump(Year|Month)$/);if(match){const prefix=match[1],year=$('#'+prefix+'JumpYear').value,month=$('#'+prefix+'JumpMonth').value,chosen=year+'-'+month;const date=chosen+'-01';if(prefix==='habit'){selectedHabitDate=date;habitCalendarMonth=chosen;}if(prefix==='journal'){journalDate=date;journalCalendarMonth=chosen;editingJournalId='';}if(prefix==='report'){reportDate=date;reportMonth=chosen;reportDetail='';}if(prefix==='food'){foodSelectedDate=date;}render();return;}if(e.target.id==='taskFilter'){render();return;}if(e.target.id==='subscriptionFilter'){subscriptionFilter=e.target.value;render();return;}if(e.target.id==='carJumpYear'||e.target.id==='carJumpMonth'){const yr=$('#carJumpYear')?.value||String(new Date().getFullYear()),mo=$('#carJumpMonth')?.value||'01';const oldDay=Number(carSelectedDate.slice(8))||1,day=Math.min(oldDay,new Date(Number(yr),Number(mo),0).getDate());carSelectedDate=`${yr}-${mo}-${String(day).padStart(2,'0')}`;carCalendarMonth=monthKey(carSelectedDate);carHistoryYear=yr;carHistoryMonth=mo;render();return;}

    if(e.target.id==='carFilter'){carFilter=e.target.value;render();return;}if(e.target.id==='journalDateTime'){journalDate=e.target.value.slice(0,10)||today();journalCalendarMonth=monthKey(journalDate);journalClearAfterSave=false;return;}if(e.target.matches('[data-action="toggle-todo"],[data-action="toggle-habit"],[data-action="toggle-pack"],[data-action="habit-progress"]'))action(e.target);});
  document.addEventListener('submit',async e=>{if(e.target.id==='journalForm'){e.preventDefault();const text=$('#journalText').value.trim(),mood=$('#journalMood').value;const stamp=$('#journalDateTime').value||localDateTime(),date=stamp.slice(0,10),time=stamp.slice(11);const old=editingJournalId?data.journals.find(x=>x.id===editingJournalId):null;if(old)Object.assign(old,{date,text,mood,time});else if(text||mood)data.journals.push({id:uid(),date,time,text,mood});editingJournalId='';journalDate=today();journalCalendarMonth=monthKey(journalDate);journalClearAfterSave=true;await save();render();return;}const cf=e.target.closest('[data-form="add-gear-category"]');if(cf){e.preventDefault();const t=data.trips.find(x=>x.id===cf.dataset.id),name=String(new FormData(cf).get('category')||'').trim();if(t&&name){t.gearCategories=tripCategories(t);if(!t.gearCategories.includes(name))t.gearCategories.push(name);await save();render();}return;}const f=e.target.closest('[data-form="add-pack"]');if(f){e.preventDefault();const t=data.trips.find(x=>x.id===f.dataset.id),name=String(new FormData(f).get('item')||'').trim();if(t&&name){const category=String(new FormData(f).get('category')||'').trim();if(category){t.gearCategories=tripCategories(t);if(!t.gearCategories.includes(category))t.gearCategories.push(category);}t.items.push({name,category,done:false});await save();render();}}});
  $('#themeToggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));setTheme(themePref());
  document.addEventListener('change',e=>{if(e.target.id==='firebaseConfig')saveFirebaseConfig();});
  $('#importFile').addEventListener('change',e=>importData(e.target.files?.[0]));
  const remindedThisSession=new Set();const carReminded=new Set();const subReminded=new Set();
  async function checkHabitReminders(){const now=new Date(),day=today(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;for(const h of data.habits){if(!habitDue(h,day)||!h.reminderEnabled||!h.reminderTime||h.reminderTime!==time||remindedThisSession.has(h.id+'|'+day)|| (h.startAt&&h.startAt.slice(0,10)>day)||habitPercent(h.id,day)===100)continue;remindedThisSession.add(h.id+'|'+day);const msg=`${h.name}：記得完成今天的習慣。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert('習慣提醒：'+msg);}}else{alert('習慣提醒：'+msg);}}}
  async function checkCarReminders(){for(const c of data.car){if(!c.reminderEnabled||!c.nextDate||c.nextDate>today()||carReminded.has(c.id+'|'+today()))continue;carReminded.add(c.id+'|'+today());const msg=`${c.title}：預定保養日期 ${c.nextDate} 已到。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  function checkSubscriptionReminders(){for(const sub of data.subscriptions||[]){if(!sub.reminderEnabled)continue;const b=billingDates(sub),key=sub.id+'|'+today();if(!b.next||b.next>dateKey(new Date(Date.now()+86400000))||subReminded.has(key))continue;subReminded.add(key);const msg=`${sub.name}：訂閱本期終止／扣款日 ${b.next}，金額 ${subMoney(sub.price,sub.currency)}。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  async function init(){try{db=await openDB();const stored=await readAll();if(stored){data=Object.assign({todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[],foods:[],tripPlans:[],tripProjects:[]},stored);if(!Array.isArray(data.foodNoteTags))data.foodNoteTags=["蔬菜","水果","油炸","水煮","肉類","乳製品"];for(const h of data.habits){if(!h.taskDays)h.taskDays='daily';if(h.targetMinutes===undefined){const match=String(h.name||'').match(/(\d+)\s*分鐘/);h.targetMinutes=match?Number(match[1]):0;}if(h.reminderEnabled===undefined)h.reminderEnabled=false;if(h.reminderTime===undefined)h.reminderTime='09:00';}}else{setDefaults();await save();}}catch(err){setDefaults();alert('本機資料庫無法開啟。請使用最新版 Safari 或 Chrome，並避免使用無痕模式。');}render();setInterval(checkHabitReminders,15000);setInterval(checkCarReminders,60000);setInterval(checkSubscriptionReminders,60000);checkCarReminders();checkSubscriptionReminders();const overdue=data.todos.filter(t=>!t.done&&t.due&&t.due<today());if(overdue.length)setTimeout(()=>{if(currentTab==='home')alert(`提醒：你有 ${overdue.length} 項逾期待辦。`);},700);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  init();
})();
</script>
