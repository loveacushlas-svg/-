    .top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:7px 10px;font-size:13px}.btn.danger{color:#a13c2f}
    .hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;margin-bottom:16px}.hero .eyebrow{color:#ffe3dd}.hero h2{font-size:23px;line-height:1.2;margin:8px 0}.hero p{margin:0;color:#fff0eb;font-size:14px}.hero-stats{display:flex;gap:22px;margin-top:18px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#ffe3dd}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:106px;color:var(--ink)}.tile .emoji{font-size:21px}.tile strong{display:block;margin:7px 0 3px}.tile small{color:var(--muted)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}.section-head h2{font-size:20px;margin:0}.subtle{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}
    .item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}.item-main{min-width:0;flex:1}.item-title{font-weight:600;overflow-wrap:anywhere}.item-title.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:4px}.textbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;font-size:13px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:90px}form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}
    .nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,250,247,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:min(780px,100%);display:grid;grid-template-columns:repeat(1,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:grid;justify-items:center;gap:4px}.nav button span{font-size:19px}.nav button.active{color:var(--accent);background:var(--accent2);font-weight:700}
    .progress{height:7px;background:#f8e5e0;border-radius:9px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:9px}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:999px;font-size:11px}.notice{border-radius:12px;background:#fff0eb;color:#945b58;padding:11px;font-size:13px;margin-bottom:12px}
    .barrow{display:grid;grid-template-columns:64px 1fr 76px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bartrack{height:10px;background:#f8e5e0;border-radius:10px;overflow:hidden}.bartrack span{display:block;height:100%;background:var(--accent);border-radius:10px}.barvalue{text-align:right;color:var(--muted)}
    .checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:9px}.calendar-weekdays div{text-align:center;color:var(--muted);font-size:12px}.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-height:48px;padding:6px 2px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink)}.calendar-day i{height:4px;max-width:90%;border-radius:5px;display:block}.calendar-day small{font-size:6px;line-height:4px;color:var(--accent)}.calendar-day.selected{background:var(--accent2);border-color:var(--accent)}.calendar-day.today span{font-weight:800;text-decoration:underline}.footnote{font-size:12px;color:var(--muted);margin-top:12px}
    details.clean{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:12px}details.clean summary{cursor:pointer;font-weight:650;list-style-position:inside}details.clean .card{margin:12px 0 0}.mini-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chart-legend{display:grid;gap:8px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}.calendar-day{min-width:0}.calendar-day:disabled{opacity:.45}.date-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(min-width:650px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:25px}.brand{font-size:30px}}
    @media(max-width:390px){.app{padding-left:12px;padding-right:12px}.top-actions .btn{padding:8px}.formgrid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}.hero-stats{gap:15px}}
    .gear-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px;margin-top:10px}.gear-grid .item{min-width:0;padding:8px 0}.gear-grid .item-actions{flex-shrink:0}.gear-grid .textbtn{padding:3px;font-size:12px}.journal-group{margin-top:8px} .journal-group details.clean{margin-top:8px} .journal-group .item{align-items:flex-start}
    #modal .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#modal .field{min-width:0}#modal .field input,#modal .field select{padding:9px 7px;font-size:14px}#modal .field.full{grid-column:1/-1}details.clean summary .meta{font-weight:400}.choice-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 15px}.choice-row .chosen{background:var(--accent);color:#fff;border-color:var(--accent)}

    .subscription-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:10px 3px 20px;scrollbar-width:thin}

    .subscription-bubble:active{transform:scale(.97)}.subscription-bubble strong{max-width:100%;overflow-wrap:anywhere;font-size:15px}.subscription-bubble small{color:var(--muted);font-size:11px}.subscription-price{font-size:14px;font-weight:700;color:var(--accent)}
    .subscription-symbol{width:62px;height:62px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:27px;font-weight:750}
    .subscription-detail-head{display:flex;flex-direction:column;align-items:center;gap:11px;padding:24px}.subscription-detail-head h2{margin:0;font-size:24px;text-align:center;overflow-wrap:anywhere}.subscription-detail-price{font-size:23px;font-weight:750;color:var(--accent)}
    .subscription-info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 12px;padding:10px 0}.subscription-info span{color:var(--muted);font-size:13px}.subscription-info strong{text-align:right;overflow-wrap:anywhere;font-size:13px}.subscription-note{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.subscription-note p{white-space:pre-wrap;overflow-wrap:anywhere}
    :root[data-theme="dark"]{--bg:#191716;--panel:#282320;--ink:#f8f0e9;--muted:#c2b0a2;--line:#4b3a30;--accent:#f3ada4;--accent2:#503536;--warn:#e2a67f;color-scheme:dark}
    :root[data-theme="dark"] input,:root[data-theme="dark"] textarea,:root[data-theme="dark"] select{background:#342b25;color:var(--ink)}
    :root[data-theme="dark"] .nav{background:rgba(28,23,20,.96)}
    :root[data-theme="dark"] .hero{background:#7d4b4b;color:#fff}
    :root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .choice-row .chosen{color:#24180f}
    :root[data-theme="dark"] .progress,:root[data-theme="dark"] .bartrack{background:#503638}
    :root[data-theme="dark"] .notice{background:#57393c;color:#ffcbc5}
    .subscription-filter{margin-bottom:12px}.subscription-list details.clean{margin-bottom:9px}.subscription-list summary{display:flex;justify-content:space-between;align-items:center;gap:8px}.subscription-list summary::marker{color:var(--accent)}
    .billing-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0;padding:12px;border-radius:13px;background:var(--accent2);font-weight:650}.billing-flow .arrow{font-size:23px;color:var(--accent)}
    .journal-entry{padding:12px 0;border-bottom:1px solid var(--line)}.journal-entry:last-child{border:0}.journal-entry p{white-space:pre-wrap;overflow-wrap:anywhere}
    .journal-entry summary{cursor:pointer;padding:7px 0}.journal-entry[open] summary{color:var(--accent)}
    form[data-form="add-pack"]{flex-wrap:wrap}form[data-form="add-pack"] input{flex:1;min-width:110px}
    :root{--line:#efdedb;--muted:#867571} :root[data-theme="dark"]{--line:#584043;--muted:#cfb4b4}

    .gear-category-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:14px}
    .gear-group{min-width:0}.gear-group-heading{min-height:48px;display:flex;justify-content:space-between;align-items:flex-start;gap:5px;border-bottom:1px solid var(--line);padding:0 0 10px}.gear-group-heading strong{font-size:16px;overflow-wrap:anywhere}.gear-group-heading .textbtn{font-size:11px;flex-shrink:0}
    .gear-group-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;padding-top:9px}.gear-check-row{display:flex;align-items:center;gap:6px;min-height:39px;min-width:0}.gear-check-row input{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent)}.gear-check-row span{flex:1;min-width:0;overflow-wrap:anywhere}.gear-check-row span.done{text-decoration:line-through;color:var(--muted)}.gear-check-row .textbtn{opacity:.7;font-size:17px}
    .gear-add-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
    @media(max-width:640px){.gear-category-layout{grid-template-columns:minmax(0,1fr)}.gear-add-form{grid-template-columns:1fr 1fr}.gear-add-form button{grid-column:1/-1}}
    @media(max-width:390px){.gear-category-layout{grid-template-columns:minmax(0,1fr);gap:12px}.gear-group-heading strong{font-size:14px}.gear-check-row{gap:4px}.gear-check-row span{font-size:13px}}
    .food-cost-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.food-cost-item{display:flex;justify-content:space-between;gap:8px;padding:9px;border-radius:10px;background:var(--accent2);font-size:12px}.food-cost-item strong{white-space:nowrap}.food-day-group{padding:14px 0;border-bottom:1px solid var(--line)}.food-day-group:last-child{border-bottom:0}
    .food-day-bubbles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.food-day-bubble{border:1px solid var(--line);border-radius:24px;padding:14px;background:var(--panel);min-width:0;box-shadow:0 4px 12px #7d4b4b0d}.food-day-bubble .food-meal-group{margin-top:10px}.food-day-bubble>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:7px}.food-day-bubble>summary::-webkit-details-marker{display:none}.food-day-summary strong{font-size:16px}.food-day-hint{font-size:12px;color:var(--accent);margin-top:4px}.food-day-bubble[open] .food-day-hint{display:none}.food-day-detail{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}.food-day-bubble details.clean{padding:9px;margin-bottom:7px}.food-note-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.food-note-tags button{font-size:12px}.hero-subscriptions{margin-top:16px;padding-top:13px;border-top:1px solid #ffffff66}.hero-subscriptions .subscription-heading{font-size:14px;font-weight:700;margin-bottom:7px}.hero-subscriptions .item{border-color:#ffffff55}.hero-subscriptions .meta{color:#fff0eb}.hero-subscriptions .btn{background:#ffffffeb;color:#56332e}@media(max-width:390px){.food-day-bubbles{grid-template-columns:1fr}}
    .page-back{margin:2px 0 12px} .food-day-link{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--ink)}.food-day-link strong{font-size:16px}.food-day-link:active{transform:scale(.98)}
    .food-tag-manager{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.food-tag-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 9px;background:var(--accent2)}.food-tag-chip button{border:0;background:transparent;color:var(--ink);padding:4px 6px}.food-tag-chip .food-tag-remove{color:var(--warn);font-weight:700}.food-tag-add{display:flex;gap:7px;margin-top:10px}.food-tag-add input{flex:1;min-width:0}.food-pie-layout{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:15px}.food-pie{width:160px;height:160px;border-radius:50%;flex-shrink:0}.food-meal-group{margin:12px 0 8px;padding:10px 0 0;border-top:1px dashed var(--line)}.food-note-preview{font-weight:400;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px}
    /* V32: 汽車紀錄表單固定雙欄，類型獨占一行；日期欄位使用原生控制項 */
    #modal .car-form-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 12px}
    #modal .car-form-grid .field{min-width:0;gap:7px}
    #modal .car-form-grid input,#modal .car-form-grid select{width:100%;min-width:0;max-width:100%;padding:11px 9px;font-size:16px}
    #modal .car-form-grid .field.full{grid-column:1/-1}
    .car-jump{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
    .car-jump .field{min-width:0}.car-jump select,.car-jump input{padding:9px 5px;font-size:14px}
    .car-history-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    @media(max-width:390px){.car-jump{grid-template-columns:repeat(2,minmax(0,1fr))}}
    /* V35：汽車表單在 iPhone 保持雙欄，限制原生日期控制項內部寬度，避免侵入相鄰里程欄位 */
    @media(max-width:600px){
      #modal .car-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;min-width:0}
      #modal .car-form-grid>.field{grid-column:auto;min-width:0;max-width:100%;overflow:hidden}
      #modal .car-form-grid>.field.full{grid-column:1/-1;overflow:visible}
      #modal .car-form-grid>.field>label{min-width:0;overflow-wrap:anywhere;font-size:11px;line-height:1.4}
      #modal .car-form-grid>.field>input{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;height:43px;padding:9px 5px;font-size:14px}
      #modal .car-form-grid>.field>input[type="date"]{font-size:12px;letter-spacing:-.35px;padding:9px 2px;overflow:hidden;-webkit-appearance:none;appearance:none}
      #modal .car-form-grid input[type="date"]::-webkit-date-and-time-value{min-width:0;width:100%;text-align:left}
      #modal .car-form-grid input[type="date"]::-webkit-datetime-edit{min-width:0;padding:0;white-space:nowrap;font-size:12px}
      #modal .car-form-grid input[type="date"]::-webkit-calendar-picker-indicator{flex-shrink:0;width:12px;margin:0;padding:0}
    }
    /* V33：所有表單提醒勾選框與文字緊鄰排列，不受通用 input 寬度影響 */
    #modal label.checkline{display:inline-flex;align-items:center;justify-content:flex-start;gap:7px;width:fit-content;max-width:100%;cursor:pointer;flex-wrap:nowrap}
    #modal label.checkline input[type="checkbox"]{display:inline-block;width:18px!important;min-width:18px!important;max-width:18px!important;height:18px;flex:0 0 18px;margin:0;padding:0;vertical-align:middle}
    #modal label.checkline .checkline-text{display:inline;min-width:0;white-space:normal;overflow-wrap:anywhere}
    .food-detail-heading{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}.food-detail-heading h3{margin:0}.food-detail-heading .subtle{text-align:right}
    .settings-services{display:grid;gap:0}.settings-service{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}.settings-service:last-child{border-bottom:0}.settings-service input[type="checkbox"]{width:22px;height:22px;flex:0 0 22px;accent-color:var(--accent)}

    /* V39：本日餐飲紀錄依序列出餐點名稱、飲食標籤、價錢，不顯示用餐時間 */
    .food-record-summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start;list-style:none}

    .food-record-name{grid-column:1;grid-row:1;overflow-wrap:anywhere;font-size:15px}
    .food-record-tags{grid-column:1;grid-row:2;color:var(--muted);font-size:12px;font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere}
    .food-record-price{grid-column:2;grid-row:1/3;justify-self:end;align-self:center;font-weight:700;white-space:nowrap;color:var(--accent)}

    /* V41：首頁日期優先保留單行，操作按鈕緊湊排列並維持觸控空間 */
    header{gap:6px;min-width:0}

    @media(max-width:390px){header{gap:4px}header .top-actions{gap:4px}header .top-actions .btn.small{padding:7px 5px;font-size:11px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="date" id="todayLabel"></div></div>
    <div class="top-actions"><button class="btn small" data-tab="settings" type="button">⚙ 設定</button><button class="btn small" id="themeToggle" type="button" aria-label="切換深淺色模式">◐ 模式</button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="主要導覽"><div class="nav-inner" id="nav"></div></nav>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(() => {
  'use strict';
  const DB_NAME='daily-life-db', DB_VERSION=1, STORE='records';
  const $ = (s,root=document)=>root.querySelector(s);
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

  function modalForm(title,fields,onSave){const old=$('#modal');if(old)old.remove();const div=document.createElement('div');div.id='modal';div.style.cssText='position:fixed;inset:0;z-index:20;background:#26180f88;display:grid;align-items:end;justify-items:center;padding:12px';div.innerHTML=`<div style="background:var(--bg);width:min(560px,100%);max-height:90dvh;overflow:auto;border-radius:22px;padding:18px"><div class="row between"><h2 style="font-size:20px;margin:0 0 14px">${title}</h2><button class="textbtn" type="button" data-close>關閉 ✕</button></div><form id="modalForm"><div class="formgrid">${fields}</div><div class="actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">儲存</button></div></form></div>`;document.body.append(div);div.addEventListener('click',async e=>{const tagButton=e.target.closest('[data-food-tag]');if(tagButton){const note=div.querySelector('[name=note]');if(!note)return;const tag=tagButton.dataset.foodTag,existing=note.value.trim(),tokens=existing.split(/[、,，\s]+/).filter(Boolean);if(!tokens.includes(tag))note.value=existing?existing+'、'+tag:tag;note.focus();return;}if(e.target.closest('[data-food-tag-add]')){const input=div.querySelector('#foodTagNew');if(!input)return;const tag=input.value.trim();if(!tag)return;if(tag.length>24){alert('標籤最多 24 字');return;}data.foodNoteTags=Array.isArray(data.foodNoteTags)?data.foodNoteTags:[];if(!data.foodNoteTags.includes(tag)){data.foodNoteTags.push(tag);await save();}input.value='';div.querySelector('#foodTagManager').innerHTML=foodTagMarkup();return;}const remove=e.target.closest('[data-food-tag-remove]');if(remove){data.foodNoteTags=(data.foodNoteTags||[]).filter(x=>x!==remove.dataset.foodTagRemove);await save();div.querySelector('#foodTagManager').innerHTML=foodTagMarkup();}});if(div.querySelector('[name="cycle"]')){const cycle=div.querySelector('[name="cycle"]'),days=div.querySelector('#habitSpecifiedDays');if(days){const update=()=>{days.classList   const field=(label,name,placeholder='',type='text',value='')=>`<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea name="${name}" placeholder="${placeholder}">${escapeHTML(value)}</textarea>`:`<input name="${name}" type="${type}" placeholder="${placeholder}" value="${escapeHTML(value)}" ${name==='title'||name==='name'?'required':''}>`}</div>`;
  function editTodo(item){const colors=[['#dfe9df','低優先（綠）'],['#dce8f8','一般（藍）'],['#f8e7c9','重要（黃）'],['#f6d8c9','高優先（橘）'],['#f2cccc','緊急（紅）']];const colorSelect=`<div class="field"><label for="todoColor">重要程度／顏色</label><select name="color" id="todoColor">${colors.map(([v,l])=>`<option value="${v}" ${(item?.color||'#dfe9df')===v?'selected':''}>${l}</option>`).join('')}</select></div>`;modalForm(item?'編輯待辦':'新增待辦',field('事項名稱','title','例如：整理露營裝備','text',item?.title||'')+field('起始日期與時間','startAt','','datetime-local',item?.startAt||'')+field('到期日期','due','','date',item?.due||'')+colorSelect+field('備註','note','選填','text',item?.note||''),async fd=>{const title=String(fd.get('title')||'').trim();if(!title)return;const values={title,startAt:fd.get('startAt')||'',due:fd.get('due')||'',color:fd.get('color')||'#dfe9df',note:fd.get('note')||''};if(item)Object.assign(item,values);else data.todos.push({id:uid(),...values,done:false,created:today()});});}
  function editHabit(item=null){const select=(name,label,values,current)=>`<div class="field"><label>${label}</label><select name="${name}">${values.map(([v,l])=>`<option value="${v}" ${String(current)===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;const units=['分鐘','小時','次','層','毫升','公里','頁','個','組','其他'].map(x=>[x,x]),categories=['健康','教育','生活','工作','運動','其他'].map(x=>[x,x]);modalForm(item?'編輯習慣':'新增習慣',field('習慣名稱','name','例如：運動','text',item?.name||'')+select('category','習慣類別',categories,item?.category||'健康')+field('目標','target','例如：20','number',String(item?habitTarget(item):20))+select('unit','單位',units,habitUnit(item||{}))+select('cycle','目標週期',[['once','單次（僅今日）'],['daily','日（每日）'],['weekly','週（起始後7天）'],['yearly','年（起始後1年）'],['specified','指定日']],item?.cycle||'daily')+field('週期起始日期','cycleStart','','date',item?.cycleStart||item?.startAt?.slice(0,10)||today())+`<div class="field full" id="habitSpecifiedDays"><label>指定日（可複選星期）</label><div class="choice-row">${['一','二','三','四','五','六','日'].map((label,i)=>`<label class="btn small checkline" style="cursor:pointer"><input type="checkbox" name="specifiedWeekdays" value="${i+1}" ${(item?.specifiedWeekdays||[]).map(Number).includes(i+1)?'checked':''} style="width:auto">${label}</label>`).join('')}</div><div class="subtle">選擇目標週期「指定日」後，習慣只在勾選的星期顯示。</div></div>`+`<div class="field full"><label class="checkline"><input type="checkbox" name="reminderEnabled" ${item?.reminderEnabled?'checked':''}><span class="checkline-text">啟用提醒（App 開啟時）</span></label></div>`+field('提醒時間','reminderTime','','time',item?.reminderTime||'09:00'),async fd=>{const name=String(fd.get('name')||'').trim();if(!name)return;const vals={name,target:Math.max(0,Number(fd.get('target'))||0),unit:fd.get('unit')||'分鐘',category:fd.get('category')||'生活',cycle:fd.get('cycle')||'daily',cycleStart:fd.get('cycleStart')||today(),specifiedDate:fd.get('specifiedDate')||today(),specifiedTime:item?.specifiedTime||'09:00',specifiedWeekdays:fd.getAll(     if(a==='food-week-prev'||a==='food-week-next'){const d=safeDate(foodSelectedDate);d.setDate(d.getDate()+(a==='food-week-prev'?-7:7));foodSelectedDate=dateKey(d);render();return;}if(a==='food-expand'){foodCalendarExpanded=!foodCalendarExpanded;render();return;}if(a==='food-today'){foodSelectedDate=today();render();return;}if(a==='food-select-date'){foodSelectedDate=el.dataset.date;render();return;}if(a==='food-chart-mode'){foodChartMode=el.value;render();return;}if(a==='food-open-day'){foodDetailDate=el.dataset.date;foodSelectedDate=foodDetailDate;previousTabs.push(currentTab);currentTab='foodDayDetail';render();window.scrollTo(0,0);return;}if(a==='food-back'){if(previousTabs.length)previousTabs.pop();currentTab='foods';render();window.scrollTo(0,0);return;}if(a==='new-food')editFood();if(a==='edit-food')editFood(data.foods.find(x=>x.id===id));if(a==='delete-food'&&confirm('刪除這筆飲食紀錄？'))data.foods=data.foods.filter(x=>x.id!==id);if(a==='new-car')editCar();if(a==='edit-car')editCar(data.car.find(x=>x.id===id));if(a==='delete-car'&&confirm('刪除這筆汽車紀錄？'))data.car=data.car.filter(x=>x.id!==id);
    if(a==='select-journal-date'){editingJournalId='';journalClearAfterSave=false;journalDate=el.dataset.date;journalCalendarMonth=monthKey(journalDate);render();return;}if(a==='journal-month-prev'||a==='journal-month-next'){journalClearAfterSave=false;const d=safeDate(journalDate);d.setDate(d.getDate()+(a==='journal-month-prev'?-7:7));journalCalendarMonth=monthKey(dateKey(d));journalDate=dateKey(d);render();return;}
    if(a==='report-delete'){const type=el.dataset.type;if(confirm('確定刪除這筆紀錄？')){if(type==='todo')data.todos=data.todos.filter(x=>x.id!==id);if(type==='car')data.car=data.car.filter(x=>x.id!==id);if(type==='journal')data.journals=data.journals.filter(x=>x.id!==id);if(type==='trip')data.trips=data.trips.filter(x=>x.id!==id);if(type==='habit'){data.habitLogs=data.habitLogs.filter(x=>x.id!==id);}}}if(a==='report-prev'||a==='report-next'){const d=safeDate(reportDate);d.setDate(d.getDate()+(a==='report-prev'?-7:7));reportMonth=monthKey(dateKey(d));reportDate=dateKey(d);reportDetail='';render();return;}if(a==='report-detail'){reportOverviewOpen=true;reportRowsOpen=true;reportDetail=reportDetail===id?'':id;render();return;}if(a==='report-day'){const date=el.dataset.date;reportDate=date;alert(`${date}：待辦 ${data.todos.filter(x=>x.due===date).length} 筆、習慣打卡 ${data.habitLogs.filter(x=>x.date===date).length} 筆、日誌 ${data.journals.filter(x=>x.date===date).length} 筆、汽車紀錄 ${data.car.filter(x=>x.date===date).length} 筆。`);return;}if(a==='report-edit'){const type=el.dataset.type;if(type==='todo')editTodo(data.todos.find(x=>x.id===id));if(type==='car')editCar(data.car.find(x=>x.id===id));if(type==='habit'){const log=data.habitLogs.find(x=>x.id===id);if(log){selectedHabitDate=log.date;habitCalendarMonth=monthKey(log.date);currentTab='habits';render();}}if(type==='journal'){editingJournalId=id;journalClearAfterSave=false;journalDate=data.journals.find(x=>x.id===id)?.date||el.dataset.date;journalCalendarMonth=monthKey(journalDate);currentTab='journal';render();}if(type==='trip'){editTrip(null,data.trips.find(x=>x.id===id));}return;}
    if(a==='export')exportData();if(a==='import')$('#importFile').click();
    if(a==='notify-test'){if(!('Notification'in window)){alert('此瀏覽器不支援 Notification API。');}else{const p=await Notification.requestPermission();$('#notifyStatus').textContent='通知狀態：'+p;if(p==='granted')new Notification('Personal Secretary',{body:'通知權限測試成功。這不代表背景提醒已設定。'});else alert('通知權限未開啟。');}}
    await save();render();
  }
  document.addEventListener('toggle',e=>{if(!e.target.isConnected)return;if(e.target.matches('details[data-trip-id]')){const id=e.target.dataset.tripId;if(e.target.open)expandedTripIds.add(id);else expandedTripIds.delete(id);}if(e.target.id==='reportOverview')reportOverviewOpen=e.target.open;if(e.target.id==='reportRows')reportRowsOpen=e.target.open;},true);
  document.addEventListener('click',e=>{if(e.target.closest('#reportRows'))e.stopPropagation();const tab=e.target.closest('[data-tab]');if(tab){if(!serviceEnabled(serviceForPage(tab.dataset.tab)))return;if(tab.dataset.tab!==currentTab)previousTabs.push(currentTab);currentTab=tab.dataset.tab;render();window.scrollTo(0,0);return;}const act=e.target.closest('[data-action]');if(act && act.tagName!=='INPUT')action(act);});
  document.addEventListener('input',e=>{if(e.target.matches('[data-action="habit-progress"]')){const id=e.target.dataset.id,pct=Number(e.target.value)||0;const label=document.querySelector('.habit-percent-'+CSS.escape(id));if(label)label.textContent=pct+'%';const bar=document.querySelector(`[data-progressbar="${CSS.escape(id)}"]`);if(bar)bar.style.width=pct+'%';const h=data.habits.find(x=>x.id===id);if(h&&habitTarget(h)>0){const meta=e.target.parentElement.querySelector('[data-habitamount]');if(meta)meta.textContent=Math.round(habitTarget(h)*pct/100)+' / '+habitTarget(h)+' '+habitUnit(h);}}});
  document.addEventListener('change',e=>{if(e.target.id==='foodChartMode'){foodChartMode=e.target.value==='tags'?'tags':'cost';render();return;}if(e.target.matches('[data-service-toggle]')){const id=e.target.dataset.serviceToggle;if(!serviceOptions.some(([key])=>key===id))return;serviceVisibility[id]=e.target.checked;try{localStorage.setItem(serviceKey,JSON.stringify(serviceVisibility));}catch(err){alert('無法儲存設定，請檢查瀏覽器儲存空間。');}return;}const match=e.target.id.match(/^(habit|journal|report|food)Jump(Year|Month)$/);if(match){const prefix=match[1],year=$('#'+prefix+'JumpYear').value,month=$('#'+prefix+'JumpMonth').value,chosen=year+'-'+month;const date=chosen+'-01';if(prefix==='habit'){selectedHabitDate=date;habitCalendarMonth=chosen;}if(prefix==='journal'){journalDate=date;journalCalendarMonth=chosen;editingJournalId='';}if(prefix==='report'){reportDate=date;reportMonth=chosen;reportDetail='';}if(prefix==='food'){foodSelectedDate=date;}render();return;}if(e.target.id==='taskFilter'){render();return;}if(e.target.id==='subscriptionFilter'){subscriptionFilter=e.target.value;render();return;}if(e.target.id==='tripFilter'){tripFilter=e.target.value;render();return;}if(e.target.id==='carJumpYear'||e.target.id==='carJumpMonth'){const yr=$('#carJumpYear')?.value||String(new Date().getFullYear()),mo=$('#carJumpMonth')?.value||'01';const oldDay=Number(carSelectedDate.slice(8))||1,day=Math.min(oldDay,new Date(Number(yr),Number(mo),0).getDate());carSelectedDate=`${yr}-${mo}-${String(day).padStart(2,'0')}`;carCalendarMonth=monthKey(carSelectedDate);carHistoryYear=yr;carHistoryMonth=mo;render();return;}

    if(e.target.id==='carFilter'){carFilter=e.target.value;render();return;}if(e.target.id==='journalDateTime'){journalDate=e.target.value.slice(0,10)||today();journalCalendarMonth=monthKey(journalDate);journalClearAfterSave=false;return;}if(e.target.matches('[data-action="toggle-todo"],[data-action="toggle-habit"],[data-action="toggle-pack"],[data-action="habit-progress"]'))action(e.target);});
  document.addEventListener('submit',async e=>{if(e.target.id==='journalForm'){e.preventDefault();const text=$('#journalText').value.trim(),mood=$('#journalMood').value;const stamp=$('#journalDateTime').value||localDateTime(),date=stamp.slice(0,10),time=stamp.slice(11);const old=editingJournalId?data.journals.find(x=>x.id===editingJournalId):null;if(old)Object.assign(old,{date,text,mood,time});else if(text||mood)data.journals.push({id:uid(),date,time,text,mood});editingJournalId='';journalDate=today();journalCalendarMonth=monthKey(journalDate);journalClearAfterSave=true;await save();render();return;}const cf=e.target.closest('[data-form="add-gear-category"]');if(cf){e.preventDefault();const t=data.trips.find(x=>x.id===cf.dataset.id),name=String(new FormData(cf).get('category')||'').trim();if(t&&name){t.gearCategories=tripCategories(t);if(!t.gearCategories.includes(name))t.gearCategories.push(name);await save();render();}return;}const f=e.target.closest('[data-form="add-pack"]');if(f){e.preventDefault();const t=data.trips.find(x=>x.id===f.dataset.id),name=String(new FormData(f).get('item')||'').trim();if(t&&name){const category=String(new FormData(f).get('category')||'').trim();if(category){t.gearCategories=tripCategories(t);if(!t.gearCategories.includes(category))t.gearCategories.push(category);}t.items.push({name,category,done:false});await save();render();}}});
  $('#themeToggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));setTheme(themePref());
  $('#importFile').addEventListener('change',e=>importData(e.target.files?.[0]));
  const remindedThisSession=new Set();const carReminded=new Set();const subReminded=new Set();
  async function checkHabitReminders(){const now=new Date(),day=today(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;for(const h of data.habits){if(!habitDue(h,day)||!h.reminderEnabled||!h.reminderTime||h.reminderTime!==time||remindedThisSession.has(h.id+'|'+day)|| (h.startAt&&h.startAt.slice(0,10)>day)||habitPercent(h.id,day)===100)continue;remindedThisSession.add(h.id+'|'+day);const msg=`${h.name}：記得完成今天的習慣。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert('習慣提醒：'+msg);}}else{alert('習慣提醒：'+msg);}}}
  async function checkCarReminders(){for(const c of data.car){if(!c.reminderEnabled||!c.nextDate||c.nextDate>today()||carReminded.has(c.id+'|'+today()))continue;carReminded.add(c.id+'|'+today());const msg=`${c.title}：預定保養日期 ${c.nextDate} 已到。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  function checkSubscriptionReminders(){for(const sub of data.subscriptions||[]){if(!sub.reminderEnabled)continue;const b=billingDates(sub),key=sub.id+'|'+today();if(!b.next||b.next>dateKey(new Date(Date.now()+86400000))||subReminded.has(key))continue;subReminded.add(key);const msg=`${sub.name}：訂閱本期終止／扣款日 ${b.next}，金額 ${subMoney(sub.price,sub.currency)}。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Personal Secretary',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  async function init(){try{db=await openDB();const stored=await readAll();if(stored){data=Object.assign({todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[],foods:[]},stored);if(!Array.isArray(data.foodNoteTags))data.foodNoteTags=["蔬菜","水果","油炸","水煮","肉類","乳製品"];for(const h of data.habits){if(!h.taskDays)h.taskDays='daily';if(h.targetMinutes===undefined){const match=String(h.name||'').match(/(\d+)\s*分鐘/);h.targetMinutes=match?Number(match[1]):0;}if(h.reminderEnabled===undefined)h.reminderEnabled=false;if(h.reminderTime===undefined)h.reminderTime='09:00';}}else{setDefaults();await save();}}catch(err){setDefaults();alert('本機資料庫無法開啟。請使用最新版 Safari 或 Chrome，並避免使用無痕模式。');}render();setInterval(checkHabitReminders,15000);setInterval(checkCarReminders,60000);setInterval(checkSubscriptionReminders,60000);checkCarReminders();checkSubscriptionReminders();const overdue=data.todos.filter(t=>!t.done&&t.due&&t.due<today());if(overdue.length)setTimeout(()=>{if(currentTab==='home')alert(`提醒：你有 ${overdue.length} 項逾期待辦。`);},700);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  init();
})();
</script>
