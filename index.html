<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Daily">
  <meta name="description" content="個人生活管理：待辦、習慣、訂閱、日誌、旅遊、汽車保養與月報表。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>My Daily</title>
  <style>
    :root{--bg:#f5f5f0;--panel:#fff;--ink:#20231f;--muted:#777c73;--line:#e5e7df;--accent:#405b4b;--accent2:#e7eee7;--warn:#9b5b37;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9bb9a2;outline-offset:2px}
    .app{max-width:780px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
    header{padding:22px 2px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.brand{font-size:27px;font-weight:750;letter-spacing:-.04em;margin:2px 0 0}.date{color:var(--muted);font-size:13px}
    .top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:7px 10px;font-size:13px}.btn.danger{color:#a13c2f}
    .hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;margin-bottom:16px}.hero .eyebrow{color:#d4e0d5}.hero h2{font-size:23px;line-height:1.2;margin:8px 0}.hero p{margin:0;color:#e2e9e2;font-size:14px}.hero-stats{display:flex;gap:22px;margin-top:18px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#d4e0d5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:106px;color:var(--ink)}.tile .emoji{font-size:21px}.tile strong{display:block;margin:7px 0 3px}.tile small{color:var(--muted)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}.section-head h2{font-size:20px;margin:0}.subtle{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}
    .item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}.item-main{min-width:0;flex:1}.item-title{font-weight:600;overflow-wrap:anywhere}.item-title.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:4px}.textbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;font-size:13px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:90px}form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}
    .nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,250,247,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:min(780px,100%);display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:grid;justify-items:center;gap:4px}.nav button span{font-size:19px}.nav button.active{color:var(--accent);background:var(--accent2);font-weight:700}
    .progress{height:7px;background:#edf0e9;border-radius:9px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:9px}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:999px;font-size:11px}.notice{border-radius:12px;background:#f8eee7;color:#814a2d;padding:11px;font-size:13px;margin-bottom:12px}
    .barrow{display:grid;grid-template-columns:64px 1fr 76px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bartrack{height:10px;background:#eef0ea;border-radius:10px;overflow:hidden}.bartrack span{display:block;height:100%;background:var(--accent);border-radius:10px}.barvalue{text-align:right;color:var(--muted)}
    .checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:9px}.calendar-weekdays div{text-align:center;color:var(--muted);font-size:12px}.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-height:48px;padding:6px 2px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink)}.calendar-day i{height:4px;max-width:90%;border-radius:5px;display:block}.calendar-day small{font-size:6px;line-height:4px;color:var(--accent)}.calendar-day.selected{background:var(--accent2);border-color:var(--accent)}.calendar-day.today span{font-weight:800;text-decoration:underline}.footnote{font-size:12px;color:var(--muted);margin-top:12px}
    details.clean{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin-bottom:12px}details.clean summary{cursor:pointer;font-weight:650;list-style-position:inside}details.clean .card{margin:12px 0 0}.mini-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chart-legend{display:grid;gap:8px}.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px}.calendar-day{min-width:0}.calendar-day:disabled{opacity:.45}.date-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(min-width:650px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:25px}.brand{font-size:30px}}
    @media(max-width:390px){.app{padding-left:12px;padding-right:12px}.top-actions .btn{padding:8px}.formgrid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}.hero-stats{gap:15px}}
    #modal .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#modal .field{min-width:0}#modal .field input,#modal .field select{padding:9px 7px;font-size:14px}#modal .field.full{grid-column:1/-1}details.clean summary .meta{font-weight:400}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="eyebrow">PERSONAL LIFE HUB</div><div class="brand">My Daily</div><div class="date" id="todayLabel"></div></div>
    <div class="top-actions"><button class="btn small" id="exportTop" aria-label="匯出備份">匯出</button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="主要導覽"><div class="nav-inner" id="nav"></div></nav>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(() => {
  'use strict';
  const DB_NAME='daily-life-db', DB_VERSION=1, STORE='records';
  const $ = (s,root=document)=>root.querySelector(s);
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const monthKey = (date) => (date||today()).slice(0,7);
  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const localDateTime = () => {const d=new Date();return `${dateKey(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const safeDate = s => {const d=new Date((s||today())+'T12:00:00');return Number.isNaN(d.getTime())?new Date():d;};
  const dateTimeLabel = s => s ? new Date(s).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) : '未設定開始時間';
  const getHabitLog = (habitId,date) => data.habitLogs.find(l=>l.habitId===habitId&&l.date===date);
  const habitPercent = (habitId,date) => {const l=getHabitLog(habitId,date);return Math.max(0,Math.min(100,Number(l?.progress ?? (l?100:0))));};
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const escapeHTML = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0);
  let db, currentTab='home', selectedHabitDate=today(), habitCalendarMonth=today().slice(0,7), habitCalendarExpanded=false, journalDate=today(), journalCalendarMonth=monthKey(), reportMonth=monthKey(), tripFilter='all', reportDetail='', journalCalendarExpanded=false, reportCalendarExpanded=false, reportDate=today(), data={todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[]};
  const tabs=[['home','⌂','首頁'],['more','＋','更多']];
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  function readAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('appdata');req.onsuccess=()=>resolve(req.result?.value||null);req.onerror=()=>reject(req.error);});}
  function save(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({key:'appdata',value:data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
  function setDefaults(){data={todos:[],habits:[{id:uid(),name:'運動 20 分鐘',active:true},{id:uid(),name:'閱讀或學習',active:true}],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[]};}
  function navRender(){$('#nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${currentTab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join('');}
  function section(title,content,action=''){return `<section class="card"><div class="section-head"><h3>${title}</h3>${action}</div>${content}</section>`;}
  function empty(msg='還沒有紀錄，新增第一筆吧。'){return `<div class="empty">${msg}</div>`;}
  function todoList(items,compact=false){if(!items.length)return empty('目前沒有待辦事項。');return items.map(t=>{const color=t.color||'#dfe9df';const start=t.startAt?dateTimeLabel(t.startAt):'未設定開始時間';const due=t.due||'未設定到期日';return `<div class="item task-item" style="border-left:5px solid ${escapeHTML(color)};padding-left:10px"><input type="checkbox" data-action="toggle-todo" data-id="${t.id}" ${t.done?'checked':''} aria-label="完成 ${escapeHTML(t.title)}"><div class="item-main"><div class="item-title ${t.done?'done':''}">${escapeHTML(t.title)}</div><div class="meta">開始：${escapeHTML(start)} · 到期：${escapeHTML(due)}${t.due&&t.due<today()&&!t.done?' · 已逾期':''}${t.note?' · '+escapeHTML(t.note):''}</div></div>${compact?'':`<div class="item-actions"><button class="textbtn" data-action="edit-todo" data-id="${t.id}">編輯</button><button class="textbtn" data-action="delete-todo" data-id="${t.id}">刪除</button></div>`}</div>`;}).join('');}
  function weekStart(date){const d=safeDate(date);d.setDate(d.getDate()-(d.getDay()+6)%7);return dateKey(d);}
  function habitDue(h,date){
    if(h.active===false && (!h.archivedAt||date>=h.archivedAt))return false;
    const start=(h.cycleStart||h.startAt||'').slice(0,10);
    if(start&&date<start)return false;
    const cycle=h.cycle||'daily';
    if(cycle==='once' && date!==(start||h.createdDate||today()))return false;
    if(cycle==='weekly' && start && date>=dateKey(new Date(safeDate(start).getTime()+7*86400000)))return false;
    if(cycle==='yearly' && start){const d=safeDate(start);d.setFullYear(d.getFullYear()+1);if(date>=dateKey(d))return false;}
    const mode=h.taskDays||'daily';
    if(mode==='specific')return String(h.specificDates||'').split(',').map(x=>x.trim().slice(0,10)).includes(date);
    if(mode==='monthly'||mode==='weekly')return true; // 任意天數是期間配額，非指定前 N 天
    return true;
  }
  function habitTarget(h){return Number(h.target??h.targetMinutes??0)||0;}
  function habitUnit(h){return h.unit||'分鐘';}
  function habitContent(date=today()){const active=data.habits.filter(h=>habitDue(h,date));if(!active.length)return empty('該日沒有排定的習慣。');return active.map(h=>{const pct=habitPercent(h.id,date),target=habitTarget(h),current=target?Math.round(target*pct)/100:pct;const mode=h.taskDays||'daily';let quota='';if(mode==='monthly'||mode==='weekly'){const period=mode==='monthly'?date.slice(0,7):weekStart(date);const count=data.habitLogs.filter(l=>l.habitId===h.id&&l.date.startsWith(period)&&Number(l.progress??100)>=100).length;const actual=mode==='weekly'?data.habitLogs.filter(l=>l.habitId===h.id&&weekStart(l.date)===period&&Number(l.progress??100)>=100).length:count;quota=` · ${mode==='monthly'?'本月':'本週'} ${actual}/${Math.max(1,Number(h.quota)||1)} 天`;}return `<div class="item habit-item"><div class="item-main"><div class="row between" style="align-items:flex-start"><div><div class="item-title">${escapeHTML(h.name)}</div><div class="meta">${escapeHTML(h.category||'生活')} · ${escapeHTML(({once:'單次',daily:'日',weekly:'週',yearly:'年'})[h.cycle]||'日')}目標${quota}</div></div><div class="item-actions"><button class="textbtn" data-action="edit-habit" data-id="${h.id}">編輯</button><button class="textbtn" data-action="delete-habit" data-id="${h.id}">移除</button></div></div><div class="row between" style="margin-top:10px"><span class="subtle" data-habitamount="${h.id}">${target?current+' / '+target+' '+escapeHTML(habitUnit(h)):pct===100?'已完成':'進度'}</span><strong class="habit-percent-${h.id}">${pct}%</strong></div><input type="range" min="0" max="100" step="5" value="${pct}" data-action="habit-progress" data-id="${h.id}" data-date="${date}" aria-label="${escapeHTML(h.name)}進度" style="padding:0;margin-top:7px;accent-color:var(--accent)"><div class="progress" style="margin-top:6px"><span data-progressbar="${h.id}" style="width:${pct}%"></span></div></div></div>`;}).join('');}
  function calendarMarkup(month,selected,action,expanded=true){const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate();let dates=[];if(expanded){for(let i=0;i<offset;i++)dates.push('');for(let d=1;d<=days;d++)dates.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);}else{const anchor=safeDate(selected),dow=(anchor.getDay()+6)%7;for(let i=0;i<7;i++){let d=new Date(anchor);d.setDate(anchor.getDate()-dow+i);dates.push(dateKey(d));}}return `<div class="calendar-grid calendar-weekdays">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar-grid">${dates.map(key=>{if(!key)return '<div></div>';const logs=data.habitLogs.filter(l=>l.date===key),due=data.habits.filter(h=>habitDue(h,key)),sum=due.length?Math.round(due.reduce((a,h)=>a+habitPercent(h.id,key),0)/due.length):0;return `<button class="calendar-day ${selected===key?'selected':''} ${key===today()?'today':''}" data-action="${action}" data-date="${key}" type="button"><span>${Number(key.slice(8))}</span><i style="width:${sum}%;background:var(--accent)"></i>${logs.length?'<small>●</small>':''}</button>`;}).join('')}</div>`;}
  function habitCalendar(){const [y,m]=habitCalendarMonth.split('-').map(Number);return `<div class="card"><div class="row between"><button class="btn small" data-action="habit-month-prev">‹</button><button class="btn small" data-action="habit-expand">${habitCalendarExpanded?'收合整月':'展開整月'} · ${y}年${m}月</button><button class="btn small" data-action="habit-month-next">›</button></div>${calendarMarkup(habitCalendarMonth,selectedHabitDate,'select-habit-date',habitCalendarExpanded)}<div class="footnote">預設顯示所選日期所在週；點選「展開整月」可查看整月。短條代表當日平均完成率。</div></div>`;}
  function home(){const open=data.todos.filter(t=>!t.done),done=data.todos.filter(t=>t.done).length,due=data.habits.filter(h=>habitDue(h,today())),completed=due.filter(h=>habitPercent(h.id,today())===100).length;const j=data.journals.find(j=>j.date===today());return `<div class="hero"><div class="eyebrow">今天也慢慢來</div><h2>安排好今天的生活。</h2><p>把重要的事情記下來，其他的慢慢完成。</p><div class="hero-stats"><div class="stat"><strong>${open.length}</strong><span>待完成事項</span></div><div class="stat"><strong>${completed}/${due.length}</strong><span>今日習慣</span></div><div class="stat"><strong>${done}</strong><span>累計已完成</span></div></div></div><div class="section-head"><h2>快速入口</h2></div><div class="grid"><button class="tile" data-tab="tasks"><span class="emoji">✓</span><strong>待辦事項</strong><small>規劃待辦</small></button><button class="tile" data-tab="subscriptions"><span class="emoji">◇</span><strong>訂閱管理</strong><small>管理訂閱與扣款</small></button><button class="tile" data-tab="journal"><span class="emoji">▤</span><strong>生活日誌</strong><small>${j?'今日已有紀錄':'記錄今天'}</small></button><button class="tile" data-tab="trips"><span class="emoji">⌁</span><strong>旅遊與裝備</strong><small>${data.trips.length} 個行程</small></button></div><div class="section-head"><h2>今日概況</h2></div><details class="clean"><summary>今天的待辦（${open.length}）</summary><div class="card">${todoList(open.slice(0,5),true)}</div></details><details class="clean"><summary>今日習慣（${completed}/${due.length}）</summary><div class="card">${habitContent()}</div></details><div class="footnote">資料儲存在目前裝置，請定期匯出 JSON 備份。</div>`;}
  function tasks(){const filter=$('#taskFilter')?.value||'open';let items=[...data.todos].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(filter==='open')items=items.filter(t=>!t.done);if(filter==='done')items=items.filter(t=>t.done);return `<div class="section-head"><h2>待辦事項</h2><button class="btn primary" data-action="new-todo">＋ 新增</button></div><div class="card"><div class="field"><label for="taskFilter">顯示</label><select id="taskFilter"><option value="open" ${filter==='open'?'selected':''}>尚未完成</option><option value="all" ${filter==='all'?'selected':''}>全部事項</option><option value="done" ${filter==='done'?'selected':''}>已完成</option></select></div><div style="margin-top:10px">${todoList(items)}</div></div>`;}
  function habits(){const active=data.habits.filter(h=>habitDue(h,selectedHabitDate)),done=active.filter(h=>habitPercent(h.id,selectedHabitDate)===100).length,avg=active.length?Math.round(active.reduce((a,h)=>a+habitPercent(h.id,selectedHabitDate),0)/active.length):0;const logs=data.habitLogs.filter(l=>l.date===selectedHabitDate&&Number(l.progress??100)>0),archived=data.habits.filter(h=>h.active===false);return `<div class="section-head"><h2>習慣行事曆</h2><button class="textbtn" data-action="select-today-habit-date">回到今天</button></div>${habitCalendar()}<div class="section-head"><h2>習慣追蹤</h2><button class="btn primary" data-action="new-habit">＋ 新習慣</button></div><div class="card"><div class="row between"><strong>${selectedHabitDate} 進度</strong><span class="subtle">${done}/${active.length} 完成 · 平均 ${avg}%</span></div><div class="progress" style="margin:10px 0 14px"><span style="width:${avg}%"></span></div>${habitContent(selectedHabitDate)}</div><div class="section-head"><h2>完成明細</h2></div><div class="card"><h3>${selectedHabitDate}</h3>${logs.length?logs.map(l=>{const h=data.habits.find(x=>x.id===l.habitId);return `<div class="item"><div class="item-main"><strong>${escapeHTML(h?.name||'已移除的習慣')}</strong><div class="meta">${h?.active===false?'已封存 · ':''}${habitPercent(l.habitId,l.date)}%</div></div></div>`;}).join(''):empty('當天沒有打卡紀錄。')}</div>${archived.length?`<details class="clean"><summary>已封存習慣（${archived.length}）</summary>${archived.map(h=>`<div class="item"><div class="item-main">${escapeHTML(h.name)}</div><button class="textbtn" data-action="restore-habit" data-id="${h.id}">恢復</button></div>`).join('')}</details>`:''}`;}

  function reports(){const m=reportMonth,monthTodos=data.todos.filter(t=>(t.created||t.due||today()).slice(0,7)===m),completed=monthTodos.filter(t=>t.done).length,logs=data.habitLogs.filter(l=>l.date.slice(0,7)===m),journals=data.journals.filter(j=>j.date.slice(0,7)===m),cars=data.car.filter(c=>(c.date||'').slice(0,7)===m),carCost=cars.reduce((s,c)=>s+(Number(c.cost)||0),0),tripsInMonth=data.trips.filter(t=>(t.date||'').slice(0,7)===m),groups={};for(const c of cars)groups[c.kind||'其他']=(groups[c.kind||'其他']||0)+(Number(c.cost)||0);const palette=['#405b4b','#9bb49d','#c4a46b','#9c7eaf','#d58e71','#7995b0','#b8b8a5'];let running=0;const entries=Object.entries(groups).filter(([k,v])=>v>0),segments=entries.map(([k,v],i)=>{const from=running;running+=v/carCost*100;return `${palette[i%palette.length]} ${from}% ${running}%`;});const pie=segments.length?`conic-gradient(${segments.join(',')})`:'conic-gradient(#e5e7df 0 100%)';const [y,mo]=m.split('-').map(Number),offset=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate(),cells=Array(offset).fill('<div></div>');for(let d=1;d<=days;d++){const key=`${m}-${String(d).padStart(2,'0')}`;const has=data.car.some(x=>x.date===key)||data.journals.some(x=>x.date===key)||data.habitLogs.some(x=>x.date===key);cells.push(`<button class="calendar-day" data-action="report-day" data-date="${key}"><span>${d}</span>${has?'<small>●</small>':''}</button>`);}const detailRows={todos:monthTodos.map(t=>({id:t.id,title:t.title,desc:t.done?'已完成':'未完成',type:'todo'})),habits:logs.map(l=>({id:l.id,title:data.habits.find(h=>h.id===l.habitId)?.name||'已移除習慣',desc:l.date+' · '+habitPercent(l.habitId,l.date)+'%',type:'habit'})),journals:journals.map(j=>({id:j.id,title:j.date,desc:j.text||j.mood||'',type:'journal'})),trips:tripsInMonth.map(t=>({id:t.id,title:t.name,desc:t.date,type:'trip'})),car:cars.map(c=>({id:c.id,title:c.title,desc:c.date+' · '+money(c.cost),type:'car'}))};const details=detailRows[reportDetail]||[];return `<div class="section-he   function subMoney(n,c){return new Intl.NumberFormat('zh-TW',{style:'currency',currency:c||'TWD',maximumFractionDigits:2}).format(Number(n)||0);}
  function addBilling(date,frequency){const d=safeDate(date);if(frequency==='day')d.setDate(d.getDate()+1);else if(frequency==='week')d.setDate(d.getDate()+7);else {const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(frequency==='quarter'?3:12));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));}return dateKey(d);}

  function subscriptions(){const items=data.subscriptions||[];return `<div class="section-head"><h2>訂閱管理</h2><button class="btn primary" data-action="new-sub">＋ 新增訂閱</button></div><p class="subtle">追蹤訂閱費用、服務期間與扣款日期。不同幣別分別顯示，不進行匯率換算。</p>${items.length?items.map(sub=>{const b=billingDates(sub);return `<details class="clean"><summary>${escapeHTML(sub.name)}　${subMoney(sub.price,sub.currency)} <span class="meta">${b.ended?'已到期':'訂閱中'} · ${escapeHTML(({day:'每日',week:'每週',quarter:'每季',year:'每年'})[sub.billingCycle]||'每月')}</span></summary><div class="meta">訂閱期間：${escapeHTML(sub.startDate||'未設定')} → ${escapeHTML(sub.endDate||'持續訂閱')}</div><div class="card"><div class="subtle">扣款時程</div><div class="row between" style="margin-top:8px"><strong>${escapeHTML(b.prev||'尚未扣款')}</strong><span>→</span><strong>${escapeHTML(b.next||'無下次扣款')}</strong></div><div class="meta">前次扣款日期 → 下次扣款日期${sub.reminderEnabled?' · 已設定前景提醒':''}</div></div>${sub.note?`<p class="subtle">${escapeHTML(sub.note)}</p>`:''}<div class="row" style="justify-content:flex-end"><button class="btn small" data-action="edit-sub" data-id="${sub.id}">編輯</button><button class="btn small danger" data-action="delete-sub" data-id="${sub.id}">刪除</button></div></details>`;}).join(''):`<div class="card">${empty('尚無訂閱服務，新增第一筆吧。')}</div>`}`;}

  function more(){return `<div class="section-head"><h2>更多功能</h2></div><div class="grid"><button class="tile" data-tab="trips"><span class="emoji">⌁</span><strong>旅遊與裝備</strong><small>露營、登山、旅行</small></button><button class="tile" data-tab="habits"><span class="emoji">◷</span><strong>習慣追蹤</strong><small>管理目標進度</small></button><button class="tile" data-tab="subscriptions"><span class="emoji">◇</span><strong>訂閱管理</strong><small>費用與扣款日期</small></button><button class="tile" data-tab="car"><span class="emoji">↗</span><strong>汽車管理</strong><small>保養、里程與支出</small></button><button class="tile" data-tab="reports"><span class="emoji">▥</span><strong>月報表</strong><small>每月紀錄摘要</small></button></div><div class="card"><h3>資料與備份</h3><p class="subtle">資料僅存在目前瀏覽器的本機資料庫。建議定期匯出 JSON，並將備份存放在安全的位置。</p><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="export">匯出 JSON 備份</button><button class="btn" data-action="import">匯入備份</button></div><p class="footnote">匯入會以備份檔內容取代目前資料，請先匯出現有資料。請勿匯入來源不明的檔案。</p></div><div class="card"><h3>提醒與通知</h3><p class="subtle">本版會在 App 開啟時提示已到期的待辦。網頁推播通知需要額外的推播伺服器與設定，尚未在本版啟用。</p><button class="btn" data-action="notify-test">測試前景通知權限</button><p class="footnote" id="notifyStatus">通知狀態：尚未檢查</p></div><div class="card"><h3>關於My Daily</h3><div class="subtle">第四版 · 本機儲存、無帳號、無雲端同步、無廣告。</div></div>`;}

  function modalForm(title,fields,onSave){const old=$('#modal');if(old)old.remove();const div=document.createElement('div');div.id='modal';div.style.cssText='position:fixed;inset:0;z-index:20;background:#18201977;display:grid;align-items:end;justify-items:center;padding:12px';div.innerHTML=`<div style="background:var(--bg);width:min(560px,100%);max-height:90dvh;overflow:auto;border-radius:22px;padding:18px"><div class="row between"><h2 style="font-size:20px;margin:0 0 14px">${title}</h2><button class="textbtn" type="button" data-close>關閉 ✕</button></div><form id="modalForm"><div class="formgrid">${fields}</div><div class="actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">儲存</button></div></form></div>`;document.body.append(div);div.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>div.remove());div.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await onSave(fd);}catch(err){return;}div.remove();await save();render();};}

  function editTodo(item){const colors=[['#dfe9df','低優先（綠）'],['#dce8f8','一般（藍）'],['#f8e7c9','重要（黃）'],['#f6d8c9','高優先（橘）'],['#f2cccc','緊急（紅）']];const colorSelect=`<div class="field"><label for="todoColor">重要程度／顏色</label><select name="color" id="todoColor">${colors.map(([v,l])=>`<option value="${v}" ${(item?.color||'#dfe9df')===v?'selected':''}>${l}</option>`).join('')}</select></div>`;modalForm(item?'編輯待辦':'新增待辦',field('事項名稱','title','例如：整理露營裝備','text',item?.title||'')+field('起始日期與時間','startAt','','datetime-local',item?.startAt||'')+field('到期日期','due','','date',item?.due||'')+colorSelect+field('備註','note','選填','text',item?.note||''),async fd=>{const title=String(fd.get('title')||'').trim();if(!title)return;const values={title,startAt:fd.get('startAt')||'',due:fd.get('due')||'',color:fd.get('color')||'#dfe9df',note:fd.get('note')||''};if(item)Object.assign(item,values);else data.todos.push({id:uid(),...values,done:false,created:today()});});}
  function editHabit(item=null){const select=(name,label,values,current)=>`<div class="field"><label>${label}</label><select name="${name}">${values.map(([v,l])=>`<option value="${v}" ${String(current)===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;const units=['分鐘','小時','次','層','杯','公里','頁','個','組','其他'].map(x=>[x,x]),categories=['健康','教育','生活','工作','運動','其他'].map(x=>[x,x]);modalForm(item?'編輯習慣':'新增習慣',field('習慣名稱','name','例如：運動','text',item?.name||'')+select('category','習慣類別',categories,item?.category||'健康')+field('目標','target','例如：20','number',String(item?habitTarget(item):20))+select('unit','單位',units,habitUnit(item||{}))+select('cycle','目標週期',[['once','單次（僅今日）'],['daily','日（每日）'],['weekly','週（起始後7天）'],['yearly','年（起始後1年）']],item?.cycle||'daily')+field('週期起始日期','cycleStart','','date',item?.cycleStart||item?.startAt?.slice(0,10)||today())+select('taskDays','任務日',[['daily','每日'],['specific','特定時間日'],['monthly','每月任意天數'],['weekly','每週任意天數']],item?.taskDays||'daily')+`<div class="field full"><label>特定時間日（可輸入多個日期時間，以逗號分隔）</label><textarea name="specificDates" placeholder="2026-10-15T09:00, 2026-10-20T18:00">${escapeHTML(item?.specificDates||'')}</textarea></div>`+field('每月／每週任意天數','quota','例如 3','number',String(item?.quota||3))+`<div class="field full"><label class="checkline"><input type="checkbox" name="reminderEnabled" ${item?.reminderEnabled?'checked':''}>啟用提醒（App 開啟時）</label></div>`+field('提醒時間','reminderTime','','time',item?.reminderTime||'09:00'),async fd=>{const name=String(fd.get('name')||'').trim();if(!name)return;const cycle=fd.get('cycle')||'daily',cycleStart=fd.get('cycleStart')||today();const vals={name,target:Math.max(0,Number(fd.get('target'))||0),unit:fd.get('unit')||'分鐘',category:fd.get('category')||'生活',cycle,cycleStart,taskDays:fd.get('taskDays')||'daily',specificDates:String(fd.get('specificDates')||''),quota:Math.max(1,Number(fd.get('quota'))||1),reminderEnabled:fd.get('reminderEnabled')==='on',reminderTime:fd.get('reminderTime')||'09:00',active:true};if(vals.reminderEnabled&&'Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}if(item)Object.assign(item,vals);else data.habits.push({id:uid(),createdDate:today(),...vals});});}
  function editTrip(copy=null,existing=null){const original=existing||copy;modalForm(existing?'編輯行程':copy?'複製為新行程':'新增行程清單',field('行程名稱','name','例如：宜蘭露營','text',original?.name||'')+field('開始日期','date','','date',original?.date||today())+field('結束日期','endDate','','date',original?.endDate||original?.date||today())+field('備註','note','地點或其他資訊','text',original?.note||''),async fd=>{const name=String(fd.get('name')||'').trim(),date=fd.get('date')||today(),endDate=fd.get('endDate')||date;if(endDate<date){alert('結束日期不可早於開始日期。');throw new Error('日期區間錯誤');}if(name){if(existing)Object.assign(existing,{name,date,endDate,note:fd.get('note')||''});else data.trips.push({id:uid(),name,date,endDate,note:fd.get('note')||'',items:copy?(copy.items||[]).map(it=>({name:it.name,done:false})):[]});}});}
  function editCar(item=null){const kinds=['保養','維修','燃料','停車','保險稅金','其他'];modalForm(item?'編輯汽車紀錄':'新增汽車紀錄',field('項目名稱','title','例如：更換機油','text',item?.title||'')+`<div class="field"><label>類型</label><select name="kind">${kinds.map(k=>`<option ${item?.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>`+field('記錄日期','date','','date',item?.date||today())+field('下次保養日期（選填）','nextDate','','date',item?.nextDate||'')+field('本次里程（km）','km','選填','number',item?.km||'')+field('下次保養里程（km，選填）','nextKm','選填','number',item?.nextKm||'')+field('金額（元）','cost','0','number',String(item?.cost||0))+`<div class="field full"><label class="checkline"><input type="checkbox" name="reminderEnabled" ${item?.reminderEnabled?'checked':''}>到期提醒（App 開啟時檢查）</label></div>`+field('備註','note','選填','text',item?.note||''),async fd=>{const title=String(fd.get('title')||'').trim();if(!title)return;const vals={title,kind:fd.get('kind')||'其他',date:fd.get('date')||today(),cost:Math.max(0,Number(fd.get('cost'))||0),km:fd.get('km')||'',nextDate:fd.get('nextDate')||'',nextKm:fd.get('nextKm')||'',reminderEnabled:fd.get('reminderEnabled')==='on',note:fd.get('note')||''};if(item)Object.assign(item,vals);else data.car.push({id:uid(),...vals});});}
  function exportData(){const payload={app:'My Daily',version:4,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daily-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function importData(file){if(!file)return;try{const obj=JSON.parse(await file.text());const incoming=obj.data||obj;if(!incoming||!Array.isArray(incoming.todos)||!Array.isArray(incoming.habits))throw new Error('備份格式不符');if(!confirm('匯入會取代目前所有資料。建議先匯出目前資料。確定繼續？'))return;data={todos:incoming.todos||[],habits:incoming.habits||[],habitLogs:incoming.habitLogs||[],journals:incoming.journals||[],trips:incoming.trips||[],car:incoming.car||[],subscriptions:incoming.subscriptions||[]};await save();render();alert('匯入完成。');}catch(e){alert('無法匯入：檔案格式錯誤或內容不完整。');}}
  async function action(el){const a=el.dataset.action,id=el.dataset.id;
    if(a==='new-sub')editSubscription();if(a==='edit-sub')editSubscription(data.subscriptions.find(x=>x.id===id));if(a==='delete-sub'&&confirm('刪除這筆訂閱？'))data.subscriptions=data.subscriptions.filter(x=>x.id!==id);if(a==='new-todo')editTodo();if(a==='edit-todo')editTodo(data.todos.find(x=>x.id===id));if(a==='delete-todo'&&confirm('確定刪除這筆待辦？'))data.todos=data.todos.filter(x=>x.id!==id);

    if(a==='toggle-habit'){const old=getHabitLog(id,today());if(old)data.habitLogs=data.habitLogs.filter(l=>l!==old);else data.habitLogs.push({id:uid(),habitId:id,date:today(),progress:100});}
    if(a==='journal-expand'){journalCalendarExpanded=!journalCalendarExpanded;render();return;}if(a==='report-expand'){reportCalendarExpanded=!reportCalendarExpanded;render();return;}if(a==='select-habit-date'){selectedHabitDate=el.dataset.date;habitCalendarMonth=monthKey(selectedHabitDate);render();return;}if(a==='habit-expand'){habitCalendarExpanded=!habitCalendarExpanded;render();return;}if(a==='select-today-habit-date'){selectedHabitDate=today();habitCalendarMonth=today().slice(0,7);render();return;}if(a==='habit-month-prev'||a==='habit-month-next'){const d=safeDate(habitCalendarMonth+'-01');d.setMonth(d.getMonth()+(a==='habit-month-prev'?-1:1));habitCalendarMonth=dateKey(d).slice(0,7);selectedHabitDate=habitCalendarMonth+'-01';render();return;}
    if(a==='habit-progress'&&el.type==='range'){const date=el.dataset.date||today(),habitId=id;let log=getHabitLog(habitId,date);const progress=Math.max(0,Math.min(100,Number(el.value)||0));if(!log){log={id:uid(),habitId,date,progress};data.habitLogs.push(log);}else log.progress=progress;}

    if(a==='edit-trip')editTrip(null,data.trips.find(x=>x.id===id));if(a==='new-trip')editTrip();if(a==='copy-trip')editTrip(data.trips.find(x=>x.id===id));if(a==='delete-trip'&&confirm('刪除此行程及裝備清單？'))data.trips=data.trips.filter(x=>x.id!==id);

    if(a==='select-journal-date'){journalDate=el.dataset.date;journalCalendarMonth=monthKey(journalDate);render();return;}if(a==='journal-month-prev'||a==='journal-month-next'){const d=safeDate(journalCalendarMonth+'-01');d.setMonth(d.getMonth()+(a==='journal-month-prev'?-1:1));journalCalendarMonth=monthKey(dateKey(d));journalDate=journalCalendarMonth+'-01';render();return;}
    if(a==='report-delete'){const type=el.dataset.type;if(confirm('確定刪除這筆紀錄？')){if(type==='todo')data.todos=data.todos.filter(x=>x.id!==id);if(type==='car')data.car=data.car.filter(x=>x.id!==id);if(type==='journal')data.journals=data.journals.filter(x=>x.id!==id);if(type==='trip')data.trips=data.trips.filter(x=>x.id!==id);if(type==='habit'){data.habitLogs=data.habitLogs.filter(x=>x.id!==id);}}}if(a==='report-prev'||a==='report-next'){const d=safeDate(reportMonth+'-01');d.setMonth(d.getMonth()+(a==='report-prev'?-1:1));reportMonth=monthKey(dateKey(d));reportDate=reportMonth+'-01';reportDetail='';render();return;}if(a==='report-detail'){reportDetail=reportDetail===id?'':id;render();return;}if(a==='report-day'){const date=el.dataset.date;reportDate=date;alert(`${date}：待辦 ${data.todos.filter(x=>x.due===date).length} 筆、習慣打卡 ${data.habitLogs.filter(x=>x.date===date).length} 筆、日誌 ${data.journals.filter(x=>x.date===date).length} 筆、汽車紀錄 ${data.car.filter(x=>x.date===date).length} 筆。`);return;}if(a==='report-edit'){const type=el.dataset.type;if(type==='todo')editTodo(data.todos.find(x=>x.id===id));if(type==='car')editCar(data.car.find(x=>x.id===id));if(type==='habit'){const log=data.habitLogs.find(x=>x.id===id);if(log){selectedHabitDate=log.date;habitCalendarMonth=monthKey(log.date);currentTab='habits';render();}}if(type==='journal'){journalDate=el.dataset.date;journalCalendarMonth=monthKey(journalDate);currentTab='journal';render();}if(type==='trip'){editTrip(null,data.trips.find(x=>x.id===id));}return;}

  document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){currentTab=tab.dataset.tab;render();return;}const act=e.target.closest('[data-action]');if(act && act.tagName!=='INPUT')action(act);});
  document.addEventListener('input',e=>{if(e.target.matches('[data-action="habit-progress"]')){const id=e.target.dataset.id,pct=Number(e.target.value)||0;const label=document.querySelector('.habit-percent-'+CSS.escape(id));if(label)label.textContent=pct+'%';const bar=document.querySelector(`[data-progressbar="${CSS.escape(id)}"]`);if(bar)bar.style.width=pct+'%';const h=data.habits.find(x=>x.id===id);if(h&&habitTarget(h)>0){const meta=e.target.parentElement.querySelector('[data-habitamount]');if(meta)meta.textContent=Math.round(habitTarget(h)*pct)/100+' / '+habitTarget(h)+' '+habitUnit(h);}}});
  document.addEventListener('change',e=>{if(e.target.id==='taskFilter'){render();return;}if(e.target.id==='tripFilter'){tripFilter=e.target.value;render();return;}if(e.target.id==='journalDateTime'){journalDate=e.target.value.slice(0,10)||today();journalCalendarMonth=monthKey(journalDate);render();return;}if(e.target.matches('[data-action="toggle-todo"],[data-action="toggle-habit"],[data-action="toggle-pack"],[data-action="habit-progress"]'))action(e.target);});
  document.addEventListener('submit',async e=>{if(e.target.id==='journalForm'){e.preventDefault();const text=$('#journalText').value.trim(),mood=$('#journalMood').value;const stamp=$('#journalDateTime').value||localDateTime(),date=stamp.slice(0,10),time=stamp.slice(11);const old=data.journals.find(x=>x.date===date);if(old)Object.assign(old,{text,mood,time});else if(text||mood)data.journals.push({id:uid(),date,time,text,mood});journalDate=date;journalCalendarMonth=monthKey(date);await save();render();return;}const f=e.target.closest('[data-form="add-pack"]');if(f){e.preventDefault();const t=data.trips.find(x=>x.id===f.dataset.id),name=String(new FormData(f).get('item')||'').trim();if(t&&name){t.items.push({name,done:false});await save();render();}}});
  $('#exportTop').addEventListener('click',exportData);$('#importFile').addEventListener('change',e=>importData(e.target.files?.[0]));
  const remindedThisSession=new Set();const carReminded=new Set();const subReminded=new Set();
  async function checkHabitReminders(){const now=new Date(),day=today(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;for(const h of data.habits){if(!habitDue(h,day)||!h.reminderEnabled||!h.reminderTime||h.reminderTime!==time||remindedThisSession.has(h.id+'|'+day)|| (h.startAt&&h.startAt.slice(0,10)>day)||habitPercent(h.id,day)===100)continue;remindedThisSession.add(h.id+'|'+day);const msg=`${h.name}：記得完成今天的習慣。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('My Daily',{body:msg});}catch(e){alert('習慣提醒：'+msg);}}else{alert('習慣提醒：'+msg);}}}
  async function checkCarReminders(){for(const c of data.car){if(!c.reminderEnabled||!c.nextDate||c.nextDate>today()||carReminded.has(c.id+'|'+today()))continue;carReminded.add(c.id+'|'+today());const msg=`${c.title}：預定保養日期 ${c.nextDate} 已到。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('My Daily',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  function checkSubscriptionReminders(){for(const sub of data.subscriptions||[]){if(!sub.reminderEnabled)continue;const b=billingDates(sub),key=sub.id+'|'+today();if(!b.next||b.next>today()||subReminded.has(key))continue;subReminded.add(key);const msg=`${sub.name}：訂閱扣款日 ${b.next}，金額 ${subMoney(sub.price,sub.currency)}。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('My Daily',{body:msg});}catch(e){alert(msg);}}else alert(msg);}}
  async function init(){try{db=await openDB();const stored=await readAll();if(stored){data=Object.assign({todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[],subscriptions:[]},stored);for(const h of data.habits){if(h.targetMinutes===undefined){const match=String(h.name||'').match(/(\d+)\s*分鐘/);h.targetMinutes=match?Number(match[1]):0;}if(h.reminderEnabled===undefined)h.reminderEnabled=false;if(h.reminderTime===undefined)h.reminderTime='09:00';}}else{setDefaults();await save();}}catch(err){setDefaults();alert('本機資料庫無法開啟。請使用最新版 Safari 或 Chrome，並避免使用無痕模式。');}render();setInterval(checkHabitReminders,15000);setInterval(checkCarReminders,60000);setInterval(checkSubscriptionReminders,60000);checkCarReminders();checkSubscriptionReminders();const overdue=data.todos.filter(t=>!t.done&&t.due&&t.due<today());if(overdue.length)setTimeout(()=>{if(currentTab==='home')alert(`提醒：你有 ${overdue.length} 項逾期待辦。`);},700);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  init();
