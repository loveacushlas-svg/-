<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日常 Daily">
  <meta name="description" content="個人生活管理：待辦、習慣、日誌、旅遊裝備、汽車保養與月報表。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>日常 Daily</title>
  <style>
    :root{--bg:#f5f5f0;--panel:#fff;--ink:#20231f;--muted:#777c73;--line:#e5e7df;--accent:#405b4b;--accent2:#e7eee7;--warn:#9b5b37;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9bb9a2;outline-offset:2px}
    .app{max-width:780px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}
    header{padding:22px 2px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.brand{font-size:27px;font-weight:750;letter-spacing:-.04em;margin:2px 0 0}.date{color:var(--muted);font-size:13px}
    .top-actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:10px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.small{padding:7px 10px;font-size:13px}.btn.danger{color:#a13c2f}
    .hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px;margin-bottom:16px}.hero .eyebrow{color:#d4e0d5}.hero h2{font-size:23px;line-height:1.2;margin:8px 0}.hero p{margin:0;color:#e2e9e2;font-size:14px}.hero-stats{display:flex;gap:22px;margin-top:18px}.stat strong{font-size:22px;display:block}.stat span{font-size:12px;color:#d4e0d5}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:106px;color:var(--ink)}.tile .emoji{font-size:21px}.tile strong{display:block;margin:7px 0 3px}.tile small{color:var(--muted)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px}.section-head h2{font-size:20px;margin:0}.subtle{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}
    .item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);margin-top:2px;flex-shrink:0}.item-main{min-width:0;flex:1}.item-title{font-weight:600;overflow-wrap:anywhere}.item-title.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:3px}.item-actions{display:flex;gap:4px}.textbtn{border:0;background:transparent;color:var(--muted);padding:4px 6px;font-size:13px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px;color:var(--ink);min-width:0}textarea{resize:vertical;min-height:90px}form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.empty{padding:22px 10px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}
    .nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(250,250,247,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.nav-inner{width:min(780px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:var(--muted);border-radius:12px;padding:8px 2px;font-size:11px;display:grid;justify-items:center;gap:4px}.nav button span{font-size:19px}.nav button.active{color:var(--accent);background:var(--accent2);font-weight:700}
    .progress{height:7px;background:#edf0e9;border-radius:9px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent);border-radius:9px}.pill{display:inline-block;background:var(--accent2);color:var(--accent);padding:4px 8px;border-radius:999px;font-size:11px}.notice{border-radius:12px;background:#f8eee7;color:#814a2d;padding:11px;font-size:13px;margin-bottom:12px}
    .barrow{display:grid;grid-template-columns:64px 1fr 76px;gap:8px;align-items:center;margin:10px 0;font-size:12px}.bartrack{height:10px;background:#eef0ea;border-radius:10px;overflow:hidden}.bartrack span{display:block;height:100%;background:var(--accent);border-radius:10px}.barvalue{text-align:right;color:var(--muted)}
    .checkline{display:flex;align-items:center;gap:9px}.checkline input{width:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:9px}.calendar-weekdays div{text-align:center;color:var(--muted);font-size:12px}.calendar-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;min-height:48px;padding:6px 2px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--ink)}.calendar-day i{height:4px;max-width:90%;border-radius:5px;display:block}.calendar-day small{font-size:6px;line-height:4px;color:var(--accent)}.calendar-day.selected{background:var(--accent2);border-color:var(--accent)}.calendar-day.today span{font-weight:800;text-decoration:underline}.footnote{font-size:12px;color:var(--muted);margin-top:12px}
.calendar-grid.week-only .calendar-day:not(.in-week){display:none}.pie{width:150px;height:150px;border-radius:50%;margin:10px auto}.fold-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
    @media(min-width:650px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:25px}.brand{font-size:30px}}
    @media(max-width:390px){.app{padding-left:12px;padding-right:12px}.top-actions .btn{padding:8px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero-stats{gap:15px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="eyebrow">PERSONAL LIFE HUB</div><div class="brand">日常 <span style="font-weight:400;color:var(--muted)">Daily</span></div><div class="date" id="todayLabel"></div></div>
    <div class="top-actions"><button class="btn small" id="exportTop" aria-label="匯出備份">匯出</button></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="主要導覽"><div class="nav-inner" id="nav"></div></nav>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">
<script>
(() => {
  'use strict';
  const DB_NAME='daily-life-db', DB_VERSION=1, STORE='records';
  const $ = (s,root=document)=>root.querySelector(s);
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const monthKey = (date) => (date||today()).slice(0,7);
  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const localDateTime = () => {const d=new Date();return `${dateKey(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  const safeDate = s => {const d=new Date((s||today())+'T12:00:00');return Number.isNaN(d.getTime())?new Date():d;};
  const dateTimeLabel = s => s ? new Date(s).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) : '未設定開始時間';
  const getHabitLog = (habitId,date) => data.habitLogs.find(l=>l.habitId===habitId&&l.date===date);
  const habitPercent = (habitId,date) => {const l=getHabitLog(habitId,date);return Math.max(0,Math.min(100,Number(l?.progress ?? (l?100:0))));};
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const escapeHTML = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(Number(n)||0);
  let db, currentTab='home', selectedHabitDate=today(), habitCalendarMonth=today().slice(0,7), data={todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[]};
  const tabs=[['tasks','✓','待辦'],['habits','◷','習慣'],['home','⌂','首頁'],['car','↗','汽車管理'],['more','＋','更多']];
  function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
  function readAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get('appdata');req.onsuccess=()=>resolve(req.result?.value||null);req.onerror=()=>reject(req.error);});}
  function save(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({key:'appdata',value:data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
  function setDefaults(){data={todos:[],habits:[{id:uid(),name:'運動 20 分鐘',active:true},{id:uid(),name:'閱讀或學習',active:true}],habitLogs:[],journals:[],trips:[],car:[]};}
  function navRender(){$('#nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${currentTab===id?'active':''}" data-tab="${id}"><span>${icon}</span>${label}</button>`).join('');}
  function section(title,content,action=''){return `<section class="card"><div class="section-head"><h3>${title}</h3>${action}</div>${content}</section>`;}
  function empty(msg='還沒有紀錄，新增第一筆吧。'){return `<div class="empty">${msg}</div>`;}
  function todoList(items,compact=false){if(!items.length)return empty('目前沒有待辦事項。');return items.map(t=>{const color=t.color||'#dfe9df';const start=t.startAt?dateTimeLabel(t.startAt):'未設定開始時間';const due=t.due||'未設定到期日';return `<div class="item task-item" style="border-left:5px solid ${escapeHTML(color)};padding-left:10px"><input type="checkbox" data-action="toggle-todo" data-id="${t.id}" ${t.done?'checked':''} aria-label="完成 ${escapeHTML(t.title)}"><div class="item-main"><div class="item-title ${t.done?'done':''}">${escapeHTML(t.title)}</div><div class="meta">開始：${escapeHTML(start)} · 到期：${escapeHTML(due)}${t.due&&t.due<today()&&!t.done?' · 已逾期':''}${t.note?' · '+escapeHTML(t.note):''}</div></div>${compact?'':`<div class="item-actions"><button class="textbtn" data-action="edit-todo" data-id="${t.id}">編輯</button><button class="textbtn" data-action="delete-todo" data-id="${t.id}">刪除</button></div>`}</div>`;}).join('');}
  let habitFullMonth=false;
  function habitContent(date=today()){const active=data.habits.filter(h=>h.active!==false);if(!active.length)return empty('尚未建立習慣。');return active.map(h=>{const pct=habitPercent(h.id,date),started=!h.startAt||h.startAt.slice(0,10)<=date,target=Number(h.target??h.targetMinutes)||0,unit=h.unit||'分鐘',current=Math.round(target*pct/100);return `<div class="item habit-item"><div class="item-main"><div class="row between" style="align-items:flex-start"><div class="item-title">${escapeHTML(h.name)}</div><div class="item-actions"><button class="textbtn" data-action="edit-habit" data-id="${h.id}">編輯</button><button class="textbtn" data-action="delete-habit" data-id="${h.id}">移除</button></div></div><div class="meta">${escapeHTML(h.category||'未分類')} · 目標週期：${escapeHTML(h.period||'日')} · 任務日：${escapeHTML(h.schedule||'每日')}${h.reminderEnabled&&h.reminderTime?' · 提醒 '+escapeHTML(h.reminderTime):''}${!started?' · 尚未開始':''}</div><div class="row between" style="margin-top:10px"><span class="subtle">${target?`${current} / ${target} ${escapeHTML(unit)}`:(pct===100?'今日已完成':pct>0?'進行中':'今日尚未完成')}</span><strong class="habit-percent-${h.id}">${pct}%</strong></div><input type="range" min="0" max="100" step="5" value="${pct}" data-action="habit-progress" data-id="${h.id}" data-date="${date}" aria-label="${escapeHTML(h.name)}進度" ${!started?'disabled':''} style="padding:0;margin-top:7px;accent-color:var(--accent)"><div class="progress" style="margin-top:6px"><span data-progressbar="${h.id}" style="width:${pct}%"></span></div></div></div>`;}).join('');}
  function habitCalendar(){const [y,m]=habitCalendarMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';const monday=new Date();monday.setDate(monday.getDate()-(monday.getDay()+6)%7);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);for(let d=1;d<=days;d++){const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dt=safeDate(key),logs=data.habitLogs.filter(l=>l.date===key),active=data.habits.filter(h=>h.active!==false&&(!h.startAt||h.startAt.slice(0,10)<=key)),sum=active.length?Math.round(active.reduce((a,h)=>a+habitPercent(h.id,key),0)/active.length):0,inWeek=dt>=monday&&dt<=sunday;cells+=`<button class="calendar-day ${selectedHabitDate===key?'selected':''} ${key===today()?'today':''} ${inWeek?'in-week':''}" data-action="select-habit-date" data-date="${key}" type="button"><span>${d}</span><i style="width:${sum}%;background:${sum===100?'var(--accent)':'#9bb49d'}"></i>${logs.length?'<small>●</small>':''}</button>`;}return `<div class="card"><div class="row between"><button class="btn small" data-action="habit-month-prev">‹ 上月</button><strong>${y} 年 ${m} 月</strong><button class="btn small" data-action="habit-month-next">下月 ›</button></div><div class="calendar-grid calendar-weekdays">${['一','二','三','四','五','六','日'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar-grid ${habitFullMonth?'':'week-only'}">${cells}</div><div class="row between" style="margin-top:8px"><button class="btn small" data-action="toggle-habit-month">${habitFullMonth?'只看本週':'查看整月'}</button><span class="footnote">點選日期查看進度</span></div></div>`;}
  function home(){const open=data.todos.filter(t=>!t.done),done=data.todos.filter(t=>t.done).length,logs=data.habitLogs.filter(l=>l.date===today()).length;const j=data.journals.find(j=>j.date===today());return `
    <div class="hero"><div class="eyebrow">今天也慢慢來</div><h2>${new Date().getHours()<12?'早安，開始今天的節奏。':new Date().getHours()<18?'午安，記得留一點時間給自己。':'晚安，整理一下今天的生活。'}</h2><p>把重要的事情記下來，其他的慢慢完成。</p><div class="hero-stats"><div class="stat"><strong>${open.length}</strong><span>待完成事項</span></div><div class="stat"><strong>${logs}/${data.habits.filter(h=>h.active!==false).length}</strong><span>今日習慣</span></div><div class="stat"><strong>${done}</strong><span>累計已完成</span></div></div></div>
    <div class="section-head"><h2>快速入口</h2></div><div class="grid">
      <button class="tile" data-tab="tasks"><span class="emoji">✓</span><strong>待辦事項</strong><small>規劃今天要做的事</small></button>
      <button class="tile" data-tab="habits"><span class="emoji">◷</span><strong>習慣追蹤</strong><small>持續累積小進步</small></button>
      <button class="tile" data-tab="journal"><span class="emoji">▤</span><strong>每日生活日誌</strong><small>${j?'今天已寫下紀錄':'記錄今天的想法'}</small></button>
      <button class="tile" data-tab="trips"><span class="emoji">⌁</span><strong>旅遊與裝備</strong><small>${data.trips.length} 個行程清單</small></button>
</div>
    <details class="card" open><summary class="fold-head"><strong>今天的待辦</strong><span class="subtle">點此收合</span></summary><div class="row between" style="margin-top:8px"><span></span><button class="btn small" data-action="new-todo">＋ 新增</button></div>${todoList(open.slice(0,4),true)}</details><details class="card" open><summary class="fold-head"><strong>今日習慣</strong><span class="subtle">點此收合</span></summary><div style="margin-top:8px">${habitContent()}</div></details>
    <div class="footnote">資料儲存在目前瀏覽器／裝置。請定期匯出備份。</div>`;}
  function tasks(){const filter=$('#taskFilter')?.value||'open';let items=[...data.todos].sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(filter==='open')items=items.filter(t=>!t.done);if(filter==='done')items=items.filter(t=>t.done);return `<div class="section-head"><h2>待辦事項</h2><button class="btn primary" data-action="new-todo">＋ 新增</button></div><div class="card"><div class="field"><label for="taskFilter">顯示</label><select id="taskFilter"><option value="open" ${filter==='open'?'selected':''}>尚未完成</option><option value="all" ${filter==='all'?'selected':''}>全部事項</option><option value="done" ${filter==='done'?'selected':''}>已完成</option></select></div><div style="margin-top:10px">${todoList(items)}</div></div>`;}
  function habits(){const active=data.habits.filter(h=>h.active!==false&&(!h.startAt||h.startAt.slice(0,10)<=selectedHabitDate)),done=active.filter(h=>habitPercent(h.id,selectedHabitDate)===100).length,avg=active.length?Math.round(active.reduce((a,h)=>a+habitPercent(h.id,selectedHabitDate),0)/active.length):0;return `<div class="section-head"><h2>習慣追蹤</h2><button class="btn primary" data-action="new-habit">＋ 新習慣</button></div><div class="section-head"><h2>習慣行事曆</h2><button class="textbtn" data-action="select-today-habit-date">回到今天</button></div>${habitCalendar()}<div class="card"><div class="row between"><strong>${selectedHabitDate===today()?'今日進度':selectedHabitDate+' 進度'}</strong><span class="subtle">${done}/${active.length} 項完成 · 平均 ${avg}%</span></div><div class="progress" style="margin:10px 0 14px"><span style="width:${avg}%"></span></div>${habitContent(selectedHabitDate)}</div><div class="card"><h3>${selectedHabitDate} 完成明細</h3>${active.length?active.map(h=>`<div class="item"><div class="item-main"><div class="row between"><strong>${escapeHTML(h.name)}</strong><span>${habitPercent(h.id,selectedHabitDate)}%</span></div><div class="progress" style="margin-top:7px"><span style="width:${habitPercent(h.id,selectedHabitDate)}%"></span></div></div></div>`).join(''):empty('該日期尚無已開始的習慣。')}</div>`;}
  let journalEditDate=today();
  function journal(){const j=data.journals.find(x=>x.date===journalEditDate);const sorted=[...data.journals].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="section-head"><h2>每日生活日誌</h2><span class="pill">${journalEditDate}</span></div><div class="card"><label for="journalDate">記錄日期與時間</label><input id="journalDate" type="datetime-local" value="${journalEditDate}T12:00" style="margin:6px 0 12px"><form id="journalForm"><div class="field"><label for="journalMood">心情</label><select id="journalMood"><option value="">不指定</option>${['很棒','平靜','普通','疲累','低落'].map(m=>`<option ${j?.mood===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label for="journalText">想記下什麼？</label><textarea id="journalText" placeholder="今天發生了什麼……">${escapeHTML(j?.text||'')}</textarea></div><button class="btn primary" style="margin-top:10px" type="submit">儲存這一天的紀錄</button></form></div><div class="section-head"><h2>日誌行事曆／過往日誌</h2><span class="subtle">${sorted.length} 筆</span></div><div class="card"><label for="journalCalendar">選擇日期查看</label><input id="journalCalendar" type="date" value="${journalEditDate}" style="margin:6px 0 12px">${sorted.length?sorted.map(x=>`<div class="item"><button class="textbtn" data-action="edit-journal" data-date="${x.date}">${x.date}</button><div class="item-main"><div>${x.mood?`<span class="pill">${escapeHTML(x.mood)}</span>`:''}</div><div style="margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere">${escapeHTML(x.text||'（只有心情紀錄）')}</div></div><button class="textbtn" data-action="delete-journal" data-id="${x.id}">刪除</button></div>`).join(''):empty()}</div>`;}
  function trips(){const filter=$('#tripFilter')?.value||'all',now=today();let list=[...data.trips];if(filter==='past')list=list.filter(t=>(t.endDate||t.date||'')<now);if(filter==='current')list=list.filter(t=>(t.startDate||t.date||'')<=now&&(t.endDate||t.date||'')>=now);return `<div class="section-head"><h2>旅遊與裝備</h2><button class="btn primary" data-action="new-trip">＋ 新行程</button></div><div class="card"><label>顯示行程</label><select id="tripFilter"><option value="all" ${filter==='all'?'selected':''}>顯示全部</option><option value="past" ${filter==='past'?'selected':''}>已過期</option><option value="current" ${filter==='current'?'selected':''}>進行中</option></select></div><p class="subtle">建立旅行清單並逐項勾選裝備。</p>${list.length?list.map(t=>`<details class="card"><summary class="fold-head"><strong>${escapeHTML(t.name)}</strong><span class="subtle">${escapeHTML(t.startDate||t.date||'日期未定')} ～ ${escapeHTML(t.endDate||t.date||'日期未定')}</span></summary><div class="row between" style="margin-top:10px"><span class="meta">${escapeHTML(t.note||'')}</span><div><button class="textbtn" data-action="clone-trip" data-id="${t.id}">複製行程</button><button class="textbtn" data-action="delete-trip" data-id="${t.id}">刪除</button></div></div>${(t.items||[]).map((it,i)=>`<div class="item"><input type="checkbox" data-action="toggle-pack" data-id="${t.id}" data-index="${i}" ${it.done?'checked':''}><div class="item-main"><div class="item-title ${it.done?'done':''}">${escapeHTML(it.name)}</div></div><button class="textbtn" data-action="delete-pack-item" data-id="${t.id}" data-index="${i}">移除</button></div>`).join('')||empty('尚未加入裝備。')}<form data-form="add-pack" data-id="${t.id}" class="row" style="margin-top:12px"><input name="item" placeholder="新增裝備，例如頭燈" required><button class="btn small" type="submit">新增</button></form></details>`).join(''): `<div class="card">${empty('沒有符合條件的行程。')}</div>`}`;}
  function editTrip(item=null){modalForm(item?'編輯行程':'新增行程清單',field('行程名稱','name','例如：宜蘭露營','text',item?.name||'')+field('開始日期','startDate','','date',item?.startDate||item?.date||today())+field('結束日期','endDate','','date',item?.endDate||item?.date||today())+field('備註','note','地點或其他資訊','text',item?.note||''),async fd=>{const name=String(fd.get('name')||'').trim();if(!name)return;const vals={name,startDate:fd.get('startDate')||today(),endDate:fd.get('endDate')||fd.get('startDate')||today(),note:fd.get('note')||''};if(item)Object.assign(item,vals);else data.trips.push({id:uid(),...vals,items:[]});});}
  function editCar(item=null){modalForm(item?'編輯汽車紀錄':'新增汽車紀錄',field('項目名稱','title','例如：更換機油','text',item?.title||'')+`<div class="field"><label>類型</label><select name="kind">${['保養','維修','燃料','停車','保險稅金','其他'].map(k=>`<option ${k===(item?.kind||'保養')?'selected':''}>${k}</option>`).join('')}</select></div>`+field('記錄日期','date','','date',item?.date||today())+field('金額（元）','cost','0','number',String(item?.cost??0))+field('當下里程（km）','km','選填','number',item?.km||'')+field('下次保養日期（選填）','nextDate','','date',item?.nextDate||'')+field('下次保養里程（選填）','nextKm','','number',item?.nextKm||'')+field('備註','note','選填','text',item?.note||''),async fd=>{const title=String(fd.get('title')||'').trim();if(!title)return;const vals={title,kind:fd.get('kind'),date:fd.get('date')||today(),cost:Math.max(0,Number(fd.get('cost'))||0),km:fd.get('km'),nextDate:fd.get('nextDate'),nextKm:fd.get('nextKm'),note:fd.get('note')};if(item)Object.assign(item,vals);else data.car.push({id:uid(),...vals});});}
  function reports(){const m=$('#reportMonth')?.value||monthKey(),monthTodos=data.todos.filter(t=>(t.created||t.due||today()).slice(0,7)===m),completed=monthTodos.filter(t=>t.done).length,logs=data.habitLogs.filter(l=>l.date.slice(0,7)===m),journalCount=data.journals.filter(j=>j.date.slice(0,7)===m).length,carCost=data.car.filter(c=>c.date.slice(0,7)===m).reduce((s,c)=>s+(Number(c.cost)||0),0);const kinds=[...new Set(data.car.filter(c=>c.date.slice(0,7)===m).map(c=>c.kind||'其他'))];const kindTotals=kinds.map(k=>({kind:k,total:data.car.filter(c=>c.date.slice(0,7)===m&&(c.kind||'其他')===k).reduce((a,c)=>a+(Number(c.cost)||0),0)}));const pieSum=kindTotals.reduce((a,x)=>a+x.total,0)||1;let piePos=0;const pieStops=kindTotals.map((x,i)=>{const start=piePos;piePos+=x.total/pieSum*100;return `${['#405b4b','#9bb49d','#d6b98c','#c58b70','#7b8da6','#b7a0c8'][i%6]} ${start}% ${piePos}%`;}).join(',');let days=[];for(let i=5;i>=0;i++){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;let cost=data.car.filter(c=>c.date.slice(0,7)===key).reduce((s,c)=>s+(Number(c.cost)||0),0);days.push({key,cost});}let max=Math.max(1,...days.map(x=>x.cost));return `<div class="section-head"><h2>月報表</h2><span class="pill">${m}</span></div><div class="card"><label for="reportMonth">選擇月份</label><input id="reportMonth" type="month" value="${m}"><h3 style="margin-top:12px">汽車支出類別</h3><div class="pie" style="background:conic-gradient(${pieStops||'#e5e7df 0 100%'})"></div>${kindTotals.map((x,i)=>`<button class="item" style="width:100%;text-align:left;background:transparent;border:0" data-action="report-kind" data-kind="${escapeHTML(x.kind)}"><span>${['🟩','🟢','🟨','🟧','🟦','🟪'][i%6]}</span><span class="item-main">${escapeHTML(x.kind)}</span><strong>${money(x.total)}</strong></button>`).join('')||empty('本月尚無汽車支出。')}</div><div class="grid"><div class="card"><div class="subtle">本月任務完成</div><div style="font-size:26px;font-weight:750;marg   function more(){return `<div class="section-head"><h2>更多功能</h2></div><div class="grid"><button class="tile" data-tab="trips"><span class="emoji">⌁</span><strong>旅遊與裝備</strong><small>露營、登山、旅行</small></button><button class="tile" data-tab="car"><span class="emoji">↗</span><strong>汽車管理</strong><small>保養、里程與支出</small></button><button class="tile" data-tab="reports"><span class="emoji">▥</span><strong>月報表</strong><small>每月紀錄摘要</small></button></div><div class="card"><h3>資料與備份</h3><p class="subtle">資料僅存在目前瀏覽器的本機資料庫。建議定期匯出 JSON，並將備份存放在安全的位置。</p><div class="row" style="flex-wrap:wrap"><button class="btn primary" data-action="export">匯出 JSON 備份</button><button class="btn" data-action="import">匯入備份</button></div><p class="footnote">匯入會以備份檔內容取代目前資料，請先匯出現有資料。請勿匯入來源不明的檔案。</p></div><div class="card"><h3>提醒與通知</h3><p class="subtle">本版會在 App 開啟時提示已到期的待辦。網頁推播通知需要額外的推播伺服器與設定，尚未在本版啟用。</p><button class="btn" data-action="notify-test">測試前景通知權限</button><p class="footnote" id="notifyStatus">通知狀態：尚未檢查</p></div><div class="card"><h3>關於日常 Daily</h3><div class="subtle">第二版 · 本機儲存、無帳號、無雲端同步、無廣告。</div></div>`;}
  function render(){navRender();$('#todayLabel').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const renderers={home,tasks,habits,journal,trips,car,reports,more};$('#view').innerHTML=(renderers[currentTab]||home)();if(currentTab==='more'&&'Notification'in window)$('#notifyStatus').textContent='通知狀態：'+Notification.permission;}
  function modalForm(title,fields,onSave){const old=$('#modal');if(old)old.remove();const div=document.createElement('div');div.id='modal';div.style.cssText='position:fixed;inset:0;z-index:20;background:#18201977;display:grid;align-items:end;justify-items:center;padding:12px';div.innerHTML=`<div style="background:var(--bg);width:min(560px,100%);max-height:90dvh;overflow:auto;border-radius:22px;padding:18px"><div class="row between"><h2 style="font-size:20px;margin:0 0 14px">${title}</h2><button class="textbtn" type="button" data-close>關閉 ✕</button></div><form id="modalForm"><div class="formgrid">${fields}</div><div class="actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary" type="submit">儲存</button></div></form></div>`;document.body.append(div);div.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>div.remove());div.querySelector('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);await onSave(fd);div.remove();await save();render();};}
  const field=(label,name,placeholder='',type='text',value='')=>`<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${type==='textarea'?`<textarea name="${name}" placeholder="${placeholder}">${escapeHTML(value)}</textarea>`:`<input name="${name}" type="${type}" placeholder="${placeholder}" value="${escapeHTML(value)}" ${name==='title'||name==='name'?'required':''}>`}</div>`;
  function editTodo(item){const colors=[['#dfe9df','低優先（綠）'],['#dce8f8','一般（藍）'],['#f8e7c9','重要（黃）'],['#f6d8c9','高優先（橘）'],['#f2cccc','緊急（紅）']];const colorSelect=`<div class="field"><label for="todoColor">重要程度／顏色</label><select name="color" id="todoColor">${colors.map(([v,l])=>`<option value="${v}" ${(item?.color||'#dfe9df')===v?'selected':''}>${l}</option>`).join('')}</select></div>`;modalForm(item?'編輯待辦':'新增待辦',field('事項名稱','title','例如：整理露營裝備','text',item?.title||'')+field('起始日期與時間','startAt','','datetime-local',item?.startAt||'')+field('到期日期','due','','date',item?.due||'')+colorSelect+field('備註','note','選填','text',item?.note||''),async fd=>{const title=String(fd.get('title')||'').trim();if(!title)return;const values={title,startAt:fd.get('startAt')||'',due:fd.get('due')||'',color:fd.get('color')||'#dfe9df',note:fd.get('note')||''};if(item)Object.assign(item,values);else data.todos.push({id:uid(),...values,done:false,created:today()});});}
  function editHabit(item=null){const sel=(label,name,opts,val)=>`<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select></div>`;modalForm(item?'編輯習慣':'新增習慣',field('習慣名稱','name','例如：運動')+field('目標','target','例如 20','number',String(item?.target??item?.targetMinutes??20))+sel('目標單位','unit',['分鐘','小時','次','層','杯'],item?.unit||'分鐘')+sel('習慣類別','category',['健康','教育','生活'],item?.category||'健康')+sel('目標週期','period',['單次','日','週','年'],item?.period||'日')+sel('任務日','schedule',['每日','特定日期','每月任意天數','每週任意天數'],item?.schedule||'每日')+field('起始日期','startAt','','date',item?.startAt?.slice(0,10)||today())+`<div class="field"><label class="checkline"><input type="checkbox" name="reminderEnabled" ${item?.reminderEnabled?'checked':''} style="width:18px">啟用提醒（App 開啟時檢查）</label></div>`+field('每日提醒時間','reminderTime','','time',item?.reminderTime||'09:00'),async fd=>{const name=String(fd.get('name')||'').trim();if(!name)return;const vals={name,target:Math.max(0,Number(fd.get('target'))||0),unit:fd.get('unit'),category:fd.get('category'),period:fd.get('period'),schedule:fd.get('schedule'),startAt:fd.get('startAt')||'',reminderEnabled:fd.get('reminderEnabled')==='on',reminderTime:fd.get('reminderTime')||'09:00',active:true};if(item)Object.assign(item,vals);else data.habits.push({id:uid(),...vals});});}
  function exportData(){const payload={app:'Daily PWA',version:1,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daily-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  async function importData(file){if(!file)return;try{const obj=JSON.parse(await file.text());const incoming=obj.data||obj;if(!incoming||!Array.isArray(incoming.todos)||!Array.isArray(incoming.habits))throw new Error('備份格式不符');if(!confirm('匯入會取代目前所有資料。建議先匯出目前資料。確定繼續？'))return;data={todos:incoming.todos||[],habits:incoming.habits||[],habitLogs:incoming.habitLogs||[],journals:incoming.journals||[],trips:incoming.trips||[],car:incoming.car||[]};await save();render();alert('匯入完成。');}catch(e){alert('無法匯入：檔案格式錯誤或內容不完整。');}}
  async function action(el){const a=el.dataset.action,id=el.dataset.id;
    if(a==='new-todo')editTodo();if(a==='edit-todo')editTodo(data.todos.find(x=>x.id===id));if(a==='delete-todo'&&confirm('確定刪除這筆待辦？'))data.todos=data.todos.filter(x=>x.id!==id);

    if(a==='toggle-habit'){const old=getHabitLog(id,today());if(old)data.habitLogs=data.habitLogs.filter(l=>l!==old);else data.habitLogs.push({id:uid(),habitId:id,date:today(),progress:100});}
    if(a==='toggle-habit-month'){habitFullMonth=!habitFullMonth;render();return;}if(a==='select-habit-date'){selectedHabitDate=el.dataset.date;render();return;}if(a==='edit-journal'){journalEditDate=el.dataset.date;render();return;}if(a==='select-today-habit-date'){selectedHabitDate=today();habitCalendarMonth=today().slice(0,7);render();return;}if(a==='habit-month-prev'||a==='habit-month-next'){const d=safeDate(habitCalendarMonth+'-01');d.setMonth(d.getMonth()+(a==='habit-month-prev'?-1:1));habitCalendarMonth=dateKey(d).slice(0,7);render();return;}
    if(a==='habit-progress'&&el.type==='range'){const date=el.dataset.date||today(),habitId=id;let log=getHabitLog(habitId,date);const progress=Math.max(0,Math.min(100,Number(el.value)||0));if(!log){log={id:uid(),habitId,date,progress};data.habitLogs.push(log);}else log.progress=progress;}
    if(a==='delete-journal'&&confirm('刪除這篇日誌？'))data.journals=data.journals.filter(x=>x.id!==id);

    if(a==='toggle-pack'){const t=data.trips.find(x=>x.id===id),it=t?.items?.[Number(el.dataset.index)];if(it)it.done=el.checked;}

    if(a==='new-car')editCar();if(a==='edit-car')editCar(data.car.find(x=>x.id===id));if(a==='delete-car'&&confirm('刪除這筆汽車紀錄？'))data.car=data.car.filter(x=>x.id!==id);
    if(a==='report-kind'){const kind=el.dataset.kind,items=data.car.filter(c=>monthKey(c.date)===($('#reportMonth')?.value||monthKey())&&(c.kind||'其他')===kind);alert(kind+'明細：\n'+(items.map(x=>`${x.date} ${x.title} ${money(x.cost)}`).join('\n')||'無紀錄'));return;}if(a==='export')exportData();if(a==='import')$('#importFile').click();
    if(a==='notify-test'){if(!('Notification'in window)){alert('此瀏覽器不支援 Notification API。');}else{const p=await Notification.requestPermission();$('#notifyStatus').textContent='通知狀態：'+p;if(p==='granted')new Notification('日常 Daily',{body:'通知權限測試成功。這不代表背景提醒已設定。'});else alert('通知權限未開啟。');}}

  document.addEventListener('input',e=>{if(e.target.matches('[data-action="habit-progress"]')){const id=e.target.dataset.id,pct=Number(e.target.value)||0;const label=document.querySelector('.habit-percent-'+CSS.escape(id));if(label)label.textContent=pct+'%';const bar=document.querySelector(`[data-progressbar="${CSS.escape(id)}"]`);if(bar)bar.style.width=pct+'%';const h=data.habits.find(x=>x.id===id);if(h&&Number(h.targetMinutes)>0){const meta=e.target.parentElement.querySelector('.subtle');if(meta)meta.textContent=Math.round(Number(h.targetMinutes)*pct/100)+' / '+h.targetMinutes+' 分鐘';}}});
  document.addEventListener('change',e=>{if(e.target.id==='reportMonth'){render();return;}if(e.target.id==='taskFilter'||e.target.id==='tripFilter'){render();return;}if(e.target.id==='journalDate'||e.target.id==='journalCalendar'){journalEditDate=e.target.value.slice(0,10)||today();render();return;}if(e.target.matches('[data-action="toggle-todo"],[data-action="toggle-habit"],[data-action="toggle-pack"],[data-action="habit-progress"]'))action(e.target);});
  document.addEventListener('submit',async e=>{if(e.target.id==='journalForm'){e.preventDefault();const text=$('#journalText').value.trim(),mood=$('#journalMood').value,date=$('#journalDate').value.slice(0,10)||journalEditDate;const old=data.journals.find(x=>x.date===date);if(old)Object.assign(old,{text,mood});else if(text||mood)data.journals.push({id:uid(),date,text,mood});journalEditDate=date;await save();render();return;}const f=e.target.closest('[data-form="add-pack"]');if(f){e.preventDefault();const t=data.trips.find(x=>x.id===f.dataset.id),name=String(new FormData(f).get('item')||'').trim();if(t&&name){t.items.push({name,done:false});await save();render();}}});
  $('#exportTop').addEventListener('click',exportData);$('#importFile').addEventListener('change',e=>importData(e.target.files?.[0]));
  const remindedThisSession=new Set();
  async function checkHabitReminders(){const now=new Date(),day=today(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;for(const h of data.habits){if(h.active===false||!h.reminderEnabled||!h.reminderTime||h.reminderTime!==time||remindedThisSession.has(h.id+'|'+day)|| (h.startAt&&h.startAt.slice(0,10)>day)||habitPercent(h.id,day)===100)continue;remindedThisSession.add(h.id+'|'+day);const msg=`${h.name}：記得完成今天的習慣。`;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('日常 Daily',{body:msg});}catch(e){alert('習慣提醒：'+msg);}}else{alert('習慣提醒：'+msg);}}}
  async function init(){try{db=await openDB();const stored=await readAll();if(stored){data=Object.assign({todos:[],habits:[],habitLogs:[],journals:[],trips:[],car:[]},stored);for(const h of data.habits){if(h.targetMinutes===undefined){const match=String(h.name||'').match(/(\d+)\s*分鐘/);h.targetMinutes=match?Number(match[1]):0;}if(h.reminderEnabled===undefined)h.reminderEnabled=false;if(h.reminderTime===undefined)h.reminderTime='09:00';}}else{setDefaults();await save();}}catch(err){setDefaults();alert('本機資料庫無法開啟。請使用最新版 Safari 或 Chrome，並避免使用無痕模式。');}render();setInterval(checkHabitReminders,15000);const overdue=data.todos.filter(t=>!t.done&&t.due&&t.due<today());if(overdue.length)setTimeout(()=>{if(currentTab==='home')alert(`提醒：你有 ${overdue.length} 項逾期待辦。`);},700);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  init();
})();
</script>
